# Transizioni starting from a two-handed weapon (spadone, martello, ascia a due mani, lama a tenaglia, cesoie,
# spada bastarda): the weight of the big swing is carried into the new weapon.
- id: tr_two_handed_one_handed
  from: two_handed
  to: one_handed
  name_key: transition.two_handed.one_handed.name
  anim: tr_swift_descent
  shape: {type: arc, r: 3.0, angle: 140, y: [0, 2.6]}
  damage_mult: 1.4
  poise: 10
  duration: 0.56
  move: {speed: 3.2, dur: 0.2}
  vfx: tr_swift_descent
- id: tr_two_handed_two_handed
  from: two_handed
  to: two_handed
  name_key: transition.two_handed.two_handed.name
  anim: tr_double_weight
  shape: {type: arc, r: 3.6, angle: 360, y: [0, 2.8]}
  damage_mult: 1.6
  poise: 10
  duration: 0.76
  vfx: tr_double_weight
- id: tr_two_handed_polearm
  from: two_handed
  to: polearm
  name_key: transition.two_handed.polearm.name
  anim: tr_lever
  shape: {type: capsule, a: [0, 1.0, 0.4], b: [0, 1.4, 4.8], r: 0.6}
  damage_mult: 1.45
  poise: 10
  duration: 0.66
  move: {speed: 4.0, dur: 0.22}
  vfx: tr_lever
- id: tr_two_handed_ranged
  from: two_handed
  to: ranged
  name_key: transition.two_handed.ranged.name
  anim: tr_cleave_and_arrow
  shape: {type: arc, r: 3.2, angle: 120, y: [0, 2.6]}
  projectile: {kind: w_link_arrow, speed: 46, radius: 0.24, life: 1.3, gravity: 2, homing: 1.5}
  damage_mult: 1.35
  poise: 10
  duration: 0.7
  move: {speed: -3.5, dur: 0.24}
  vfx: tr_cleave_and_arrow
- id: tr_two_handed_catalyst
  from: two_handed
  to: catalyst
  name_key: transition.two_handed.catalyst.name
  anim: tr_seal_strike
  shape: {type: cylinder, c: [0, -0.5, 2.0], r: 2.6, h: 3.0}
  damage_mult: 1.5
  poise: 10
  duration: 0.72
  vfx: tr_seal_strike
- id: tr_two_handed_fist
  from: two_handed
  to: fist
  name_key: transition.two_handed.fist.name
  anim: tr_shoulder_check
  shape: {type: capsule, a: [0, 1.2, 0.3], b: [0, 1.6, 2.2], r: 0.75}
  damage_mult: 1.45
  poise: 10
  duration: 0.58
  move: {speed: 6.0, dur: 0.2}
  vfx: tr_shoulder_check
- id: tr_two_handed_flexible
  from: two_handed
  to: flexible
  name_key: transition.two_handed.flexible.name
  anim: tr_weight_spin
  shape: {type: arc, r: 4.6, r_in: 0.8, angle: 300, y: [0, 2.6]}
  damage_mult: 1.45
  poise: 10
  duration: 0.74
  vfx: tr_weight_spin
