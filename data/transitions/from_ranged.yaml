# Transizioni starting from a ranged weapon (arco lungo, balestra, arpione, chakram): a last point-blank shot or
# throw flows into the new weapon's opening.
- id: tr_ranged_one_handed
  from: ranged
  to: one_handed
  name_key: transition.ranged.one_handed.name
  anim: tr_shot_and_cut
  shape: {type: arc, r: 2.8, angle: 140, y: [0.1, 2.4]}
  projectile: {kind: w_link_arrow, speed: 46, radius: 0.22, life: 1.0, gravity: 2, homing: 1.5}
  damage_mult: 1.2
  poise: 10
  duration: 0.6
  move: {speed: 4.0, dur: 0.18}
  vfx: tr_shot_and_cut
- id: tr_ranged_two_handed
  from: ranged
  to: two_handed
  name_key: transition.ranged.two_handed.name
  anim: tr_leaping_cleave
  shape: {type: cylinder, c: [0, -0.5, 1.8], r: 2.2, h: 3.0}
  damage_mult: 1.5
  poise: 10
  duration: 0.74
  move: {speed: 6.5, dur: 0.3}
  vfx: tr_leaping_cleave
- id: tr_ranged_polearm
  from: ranged
  to: polearm
  name_key: transition.ranged.polearm.name
  anim: tr_shot_and_charge
  shape: {type: capsule, a: [0, 1.3, 0.4], b: [0, 1.3, 4.6], r: 0.55}
  damage_mult: 1.4
  poise: 10
  duration: 0.66
  move: {speed: 7.0, dur: 0.26}
  vfx: tr_shot_and_charge
- id: tr_ranged_ranged
  from: ranged
  to: ranged
  name_key: transition.ranged.ranged.name
  anim: tr_double_string
  projectile: {kind: w_link_arrow, speed: 50, radius: 0.24, life: 1.4, gravity: 2, homing: 1.8, count: 2, spread: 6}
  damage_mult: 1.3
  poise: 10
  duration: 0.6
  vfx: tr_double_string
- id: tr_ranged_catalyst
  from: ranged
  to: catalyst
  name_key: transition.ranged.catalyst.name
  anim: tr_arcane_dart
  projectile: {kind: w_link_orb, speed: 28, radius: 0.4, life: 1.5, homing: 2.6, count: 3, spread: 22}
  damage_mult: 1.3
  poise: 10
  duration: 0.64
  vfx: tr_arcane_dart
- id: tr_ranged_fist
  from: ranged
  to: fist
  name_key: transition.ranged.fist.name
  anim: tr_elbow
  shape: {type: capsule, a: [0, 1.4, 0.3], b: [0, 1.4, 1.9], r: 0.65}
  damage_mult: 1.35
  poise: 10
  duration: 0.5
  move: {speed: 6.0, dur: 0.18}
  vfx: tr_elbow
- id: tr_ranged_flexible
  from: ranged
  to: flexible
  name_key: transition.ranged.flexible.name
  anim: tr_flying_lash
  shape: {type: capsule, a: [0, 1.4, 0.6], b: [0, 1.0, 5.6], r: 0.55}
  damage_mult: 1.3
  poise: 10
  duration: 0.62
  vfx: tr_flying_lash
