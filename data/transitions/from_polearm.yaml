# Transizioni starting from a polearm (lancia, alabarda, naginata, tridente, trivella, falce): the long shaft gives
# leverage, distance and vaults.
- id: tr_polearm_one_handed
  from: polearm
  to: one_handed
  name_key: transition.polearm.one_handed.name
  anim: tr_step_inside
  shape: {type: arc, r: 2.8, angle: 150, y: [0.1, 2.4]}
  damage_mult: 1.3
  poise: 10
  duration: 0.56
  move: {speed: 5.0, dur: 0.2}
  vfx: tr_step_inside
- id: tr_polearm_two_handed
  from: polearm
  to: two_handed
  name_key: transition.polearm.two_handed.name
  anim: tr_vault
  shape: {type: cylinder, c: [0, -0.5, 2.2], r: 2.2, h: 3.2}
  damage_mult: 1.55
  poise: 10
  duration: 0.74
  move: {speed: 5.5, dur: 0.3}
  vfx: tr_vault
- id: tr_polearm_polearm
  from: polearm
  to: polearm
  name_key: transition.polearm.polearm.name
  anim: tr_shaft_wheel
  shape: {type: arc, r: 4.3, r_in: 0.9, angle: 360, y: [0.1, 2.6]}
  damage_mult: 1.45
  poise: 10
  duration: 0.7
  vfx: tr_shaft_wheel
- id: tr_polearm_ranged
  from: polearm
  to: ranged
  name_key: transition.polearm.ranged.name
  anim: tr_prop_shot
  shape: {type: capsule, a: [0, 1.2, 0.4], b: [0, 1.2, 4.2], r: 0.5}
  projectile: {kind: w_link_arrow, speed: 48, radius: 0.24, life: 1.3, gravity: 2, homing: 1.5}
  damage_mult: 1.3
  poise: 10
  duration: 0.66
  vfx: tr_prop_shot
- id: tr_polearm_catalyst
  from: polearm
  to: catalyst
  name_key: transition.polearm.catalyst.name
  anim: tr_shaft_sigil
  shape: {type: ring, r0: 1.0, r1: 4.6, width: 1.3, height: 2.0}
  damage_mult: 1.35
  poise: 10
  duration: 0.7
  vfx: tr_shaft_sigil
- id: tr_polearm_fist
  from: polearm
  to: fist
  name_key: transition.polearm.fist.name
  anim: tr_butt_and_fist
  shape: {type: capsule, a: [0, 1.3, 0.3], b: [0, 1.3, 2.4], r: 0.6}
  damage_mult: 1.35
  poise: 10
  duration: 0.54
  move: {speed: 4.5, dur: 0.18}
  vfx: tr_butt_and_fist
- id: tr_polearm_flexible
  from: polearm
  to: flexible
  name_key: transition.polearm.flexible.name
  anim: tr_shaft_lash
  shape: {type: arc, r: 5.2, r_in: 1.2, angle: 120, y: [0, 2.4]}
  damage_mult: 1.35
  poise: 10
  duration: 0.64
  vfx: tr_shaft_lash
