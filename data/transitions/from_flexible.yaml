# Transizioni starting from flexible weapons (spada serpentina, catene, frusta, flagello, arma mutaforma): the lash's
# momentum is recovered and redirected.
- id: tr_flexible_one_handed
  from: flexible
  to: one_handed
  name_key: transition.flexible.one_handed.name
  anim: tr_rewind
  shape: {type: arc, r: 2.9, angle: 150, y: [0.1, 2.4]}
  damage_mult: 1.3
  poise: 10
  duration: 0.54
  move: {speed: 4.0, dur: 0.18}
  vfx: tr_rewind
- id: tr_flexible_two_handed
  from: flexible
  to: two_handed
  name_key: transition.flexible.two_handed.name
  anim: tr_counterweight
  shape: {type: cylinder, c: [0, -0.5, 1.9], r: 2.3, h: 3.0}
  damage_mult: 1.55
  poise: 10
  duration: 0.72
  move: {speed: 3.5, dur: 0.24}
  vfx: tr_counterweight
- id: tr_flexible_polearm
  from: flexible
  to: polearm
  name_key: transition.flexible.polearm.name
  anim: tr_lash_and_thrust
  shape: {type: capsule, a: [0, 1.3, 0.4], b: [0, 1.3, 4.8], r: 0.55}
  damage_mult: 1.4
  poise: 10
  duration: 0.62
  move: {speed: 4.5, dur: 0.22}
  vfx: tr_lash_and_thrust
- id: tr_flexible_ranged
  from: flexible
  to: ranged
  name_key: transition.flexible.ranged.name
  anim: tr_crack_and_arrow
  shape: {type: arc, r: 4.4, r_in: 1.0, angle: 90, y: [0, 2.4]}
  projectile: {kind: w_link_arrow, speed: 46, radius: 0.24, life: 1.3, gravity: 2, homing: 1.5}
  damage_mult: 1.3
  poise: 10
  duration: 0.64
  vfx: tr_crack_and_arrow
- id: tr_flexible_catalyst
  from: flexible
  to: catalyst
  name_key: transition.flexible.catalyst.name
  anim: tr_arcane_spiral
  shape: {type: ring, r0: 0.8, r1: 4.2, width: 1.2, height: 2.0}
  damage_mult: 1.35
  poise: 10
  duration: 0.66
  vfx: tr_arcane_spiral
- id: tr_flexible_fist
  from: flexible
  to: fist
  name_key: transition.flexible.fist.name
  anim: tr_yank
  shape: {type: capsule, a: [0, 1.4, 0.3], b: [0, 1.4, 2.0], r: 0.65}
  damage_mult: 1.4
  poise: 10
  duration: 0.56
  move: {speed: 5.5, dur: 0.18}
  vfx: tr_yank
- id: tr_flexible_flexible
  from: flexible
  to: flexible
  name_key: transition.flexible.flexible.name
  anim: tr_double_crack
  shape: {type: arc, r: 5.2, r_in: 1.0, angle: 360, y: [0, 2.6]}
  damage_mult: 1.45
  poise: 10
  duration: 0.7
  vfx: tr_double_crack
