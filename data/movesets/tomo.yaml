    {id: tm_h, anim: grimoire_burst, startup: 0.6, active: 0.1, recovery: 0.5, cancel: 0.3, damage_mult: 1.35, poise: 20, projectile: {kind: w_lie_glyph, speed: 16, radius: 0.45, life: 2.2, count: 5, spread: 60, homing: 3.0}, arc: {from: [-60, 20], to: [60, 20], roll: 0, hand: both}}
