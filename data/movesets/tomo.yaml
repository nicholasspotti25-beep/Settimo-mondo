  tomo_jump:
    {id: tm_j, anim: cast_down, startup: 0.2, active: 0.16, recovery: 0.5, damage_mult: 1.35, poise: 20, element: spirit, shape: {type: cylinder, c: [0, -1.0, 0.8], r: 2.0, h: 2.6}, arc: {from: [0, 60], to: [0, -70], roll: 0, hand: both}}
