# Tomo (Grimorio delle Menzogne). Catalyst of the trickster: pages tear free as twin homing shards, then a
# glyph that circles before biting; heavy = a fan of five lying glyphs that seek the target.
id: tomo
type: tomo
grip: catalyst
reach: 16
guard: {absorption: 0.5}
swings:
  tomo_light:
    - {id: tm_l1, anim: page_flick_r, startup: 0.24, active: 0.08, recovery: 0.36, cancel: 0.22, damage_mult: 0.65, poise: 0, projectile: {kind: w_page_shard, speed: 26, radius: 0.28, life: 1.5, count: 2, spread: 10, homing: 2.6}, arc: {from: [-40, 10], to: [10, 0], roll: 0, hand: r}}
    - {id: tm_l2, anim: page_flick_l, startup: 0.24, active: 0.08, recovery: 0.36, cancel: 0.22, damage_mult: 0.65, poise: 0, projectile: {kind: w_page_shard, speed: 26, radius: 0.28, life: 1.5, count: 2, spread: 10, homing: 2.6}, arc: {from: [40, 10], to: [-10, 0], roll: 0, hand: r}}
    - {id: tm_l3, anim: glyph_cast, startup: 0.34, active: 0.08, recovery: 0.46, cancel: 0.28, damage_mult: 0.95, poise: 0, projectile: {kind: w_lie_glyph, speed: 18, radius: 0.45, life: 2.0, homing: 3.5}, arc: {from: [0, 40], to: [0, 0], roll: 0, hand: r}}
