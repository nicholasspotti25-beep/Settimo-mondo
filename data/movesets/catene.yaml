# Catene (Triplice Guinzaglio). Three hooked chains: every light lash is three quick ticks (one per chain) at
# mid reach; heavy = all three chains whirled around you; running = hook thrown ahead.
id: catene
type: catene
grip: flexible
reach: 4.5
guard: {absorption: 0.5}
swings:
  catene_light:
    - {id: ct_l1, anim: chain_lash_r, startup: 0.22, active: 0.18, recovery: 0.4, cancel: 0.2, damage_mult: 0.66, poise: 0, hits: 3, shape: {type: arc, r: 4.5, r_in: 0.6, angle: 100, y: [0.1, 2.4]}, arc: {from: [-80, 20], to: [50, -5], roll: -20, hand: r}}
    - {id: ct_l2, anim: chain_lash_l, startup: 0.22, active: 0.18, recovery: 0.4, cancel: 0.2, damage_mult: 0.66, poise: 0, hits: 3, shape: {type: arc, r: 4.5, r_in: 0.6, angle: 100, y: [0.1, 2.4]}, arc: {from: [80, 20], to: [-50, -5], roll: 20, hand: l}}
    - {id: ct_l3, anim: chain_overhead, startup: 0.32, active: 0.2, recovery: 0.5, cancel: 0.26, damage_mult: 0.84, poise: 0, hits: 3, shape: {type: box, c: [0, 0.9, 3.0], half: [0.9, 1.3, 1.8]}, arc: {from: [0, 110], to: [0, -40], roll: 0, hand: both}}
  catene_heavy:
    {id: ct_h, anim: chain_whirl, startup: 0.5, active: 0.42, recovery: 0.55, cancel: 0.3, damage_mult: 1.2, poise: 24, hits: 4, shape: {type: arc, r: 4.2, r_in: 0.5, angle: 360, y: [0, 2.4]}, arc: {from: [-180, 5], to: [180, 5], roll: 0, hand: both}}
  catene_run:
    {id: ct_r, anim: hook_throw, startup: 0.24, active: 0.18, recovery: 0.5, damage_mult: 1.25, poise: 0, shape: {type: capsule, a: [0, 1.2, 0.5], b: [0, 1.0, 6.0], r: 0.45}, move: {speed: 5.0, dur: 0.2}, arc: {from: [-10, 40], to: [0, 0], roll: 0, hand: r}}
  catene_jump:
    {id: ct_j, anim: chain_slam, startup: 0.2, active: 0.22, recovery: 0.55, damage_mult: 1.5, poise: 20, shape: {type: box, c: [0, -0.2, 2.4], half: [1.0, 1.4, 1.8]}, arc: {from: [0, 100], to: [0, -70], roll: 0, hand: both}}
