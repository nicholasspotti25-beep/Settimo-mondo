# Arpione (Arpione Abissale). Mid-range hybrid: a thrust, then the harpoon is thrown on its chain and reeled back
# (it can strike going out and coming back), then a heave that sweeps. Heavy = long throw that pierces.
id: arpione
type: arpione
grip: polearm
reach: 4.0
guard: {absorption: 0.4}
swings:
  arpione_light:
    - {id: hp_l1, anim: harpoon_thrust, startup: 0.2, active: 0.12, recovery: 0.4, cancel: 0.2, damage_mult: 1.0, poise: 0, element: water, shape: {type: capsule, a: [0, 1.3, 0.4], b: [0, 1.3, 3.8], r: 0.45}, move: {speed: 2.6, dur: 0.18}, arc: {from: [0, 0], to: [0, 0], roll: 0, hand: both}}
    - {id: hp_l2, anim: harpoon_throw, startup: 0.3, active: 0.08, recovery: 0.6, cancel: 0.4, damage_mult: 0.65, poise: 0, projectile: {kind: w_harpoon, speed: 30, radius: 0.35, life: 1.2, homing: 1.4, returns: true}, arc: {from: [0, 40], to: [0, 0], roll: 0, hand: r}}
    - {id: hp_l3, anim: harpoon_heave, startup: 0.26, active: 0.14, recovery: 0.45, cancel: 0.24, damage_mult: 1.15, poise: 0, element: water, shape: {type: arc, r: 3.6, r_in: 0.6, angle: 120, y: [0, 2.4]}, move: {speed: 1.6, dur: 0.18}, arc: {from: [-70, 0], to: [70, 10], roll: 0, hand: both}}
  arpione_heavy:
    {id: hp_h, anim: harpoon_long_throw, startup: 0.5, active: 0.08, recovery: 0.6, cancel: 0.4, damage_mult: 1.2, poise: 20, projectile: {kind: w_harpoon, speed: 36, radius: 0.4, life: 1.5, homing: 1.4, returns: true, pierce: true}, arc: {from: [0, 60], to: [0, 0], roll: 0, hand: r}}
  arpione_run:
    {id: hp_r, anim: charge_thrust, startup: 0.22, active: 0.16, recovery: 0.5, damage_mult: 1.3, poise: 0, element: water, shape: {type: capsule, a: [0, 1.3, 0.4], b: [0, 1.3, 4.2], r: 0.5}, move: {speed: 8.0, dur: 0.32}, arc: {from: [0, 0], to: [0, 0], roll: 0, hand: both}}
  arpione_jump:
    {id: hp_j, anim: plunge, startup: 0.2, active: 0.2, recovery: 0.55, damage_mult: 1.5, poise: 20, element: water, shape: {type: capsule, a: [0, -0.4, 0.6], b: [0, 0.2, 3.0], r: 0.8}, arc: {from: [0, 60], to: [0, -50], roll: 0, hand: both}}
