    {id: sc_r, anim: shield_rush, startup: 0.2, active: 0.18, recovery: 0.5, damage_mult: 1.3, poise: 0, element: ice, shape: {type: box, c: [0, 1.2, 1.2], half: [1.0, 1.1, 0.9]}, move: {speed: 9.0, dur: 0.36}, arc: {from: [0, 0], to: [0, 0], roll: 0, hand: l}}
  scudo_jump:
