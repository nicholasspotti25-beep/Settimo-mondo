    - {id: sb_l1, anim: royal_cut_rl, startup: 0.22, active: 0.14, recovery: 0.4, cancel: 0.2, damage_mult: 1.15, poise: 0, element: light, shape: {type: arc, r: 3.3, angle: 140, y: [0.1, 2.6]}, move: {speed: 2.6, dur: 0.2}, arc: {from: [-80, 30], to: [70, -15], roll: -25, hand: r}}
