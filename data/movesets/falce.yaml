    - {id: fc_l1, anim: reap_rl, startup: 0.3, active: 0.18, recovery: 0.45, cancel: 0.24, damage_mult: 1.25, poise: 0, element: void, shape: {type: arc, r: 4.5, r_in: 1.4, angle: 170, y: [0, 2.6]}, move: {speed: 2.0, dur: 0.24}, arc: {from: [-100, 20], to: [80, -10], roll: -20, hand: both}}
