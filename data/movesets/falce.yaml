# Falce (Falce dell'Eclissi). The scythe reaps at the blade, not the shaft (inner dead zone): wide reaping arcs, a
# full harvest spin and an overhead. Heavy = eclipse sweep behind and in front. Void element.
id: falce
type: falce
grip: polearm
reach: 4.5
guard: {absorption: 0.7}
swings:
