# Spada serpentina (Zanna Strisciante). A sword whose segments unlock: the first cut is a short blade, then the
# blade uncoils into a long lash and finally a wide serpent sweep. Rewards spacing between 2 and 5 m.
id: spada_serpentina
type: spada_serpentina
grip: flexible
reach: 5.4
guard: {absorption: 0.5}
swings:
  spada_serpentina_light:
    - {id: sp_l1, anim: slash_rl, startup: 0.18, active: 0.12, recovery: 0.36, cancel: 0.18, damage_mult: 0.95, poise: 0, shape: {type: arc, r: 2.6, angle: 120, y: [0.1, 2.4]}, move: {speed: 2.4, dur: 0.18}, arc: {from: [-70, 10], to: [65, -10], roll: -20, hand: r}}
    - {id: sp_l2, anim: whip_lash, startup: 0.26, active: 0.16, recovery: 0.42, cancel: 0.22, damage_mult: 1.1, poise: 0, shape: {type: capsule, a: [0, 1.2, 0.5], b: [0, 1.1, 5.6], r: 0.42}, arc: {from: [10, 60], to: [0, -5], roll: 0, hand: r}}
    - {id: sp_l3, anim: whip_sweep, startup: 0.3, active: 0.2, recovery: 0.5, cancel: 0.26, damage_mult: 1.25, poise: 0, shape: {type: arc, r: 5.2, r_in: 1.0, angle: 200, y: [0.2, 2.2]}, arc: {from: [-110, 5], to: [110, 0], roll: -10, hand: r}}
  spada_serpentina_heavy:
    {id: sp_h, anim: whip_overhead, startup: 0.5, active: 0.18, recovery: 0.55, cancel: 0.3, damage_mult: 1.85, poise: 22, shape: {type: capsule, a: [0, 2.0, 0.6], b: [0, 0.4, 6.2], r: 0.55}, arc: {from: [0, 110], to: [0, -30], roll: 0, hand: r}}
  spada_serpentina_run:
    {id: sp_r, anim: whip_lash, startup: 0.24, active: 0.16, recovery: 0.46, damage_mult: 1.3, poise: 0, shape: {type: capsule, a: [0, 1.2, 0.5], b: [0, 1.1, 5.0], r: 0.45}, move: {speed: 6.0, dur: 0.26}, arc: {from: [-20, 30], to: [0, 0], roll: 0, hand: r}}
  spada_serpentina_jump:
    {id: sp_j, anim: whip_down, startup: 0.2, active: 0.2, recovery: 0.52, damage_mult: 1.5, poise: 20, shape: {type: capsule, a: [0, 0.4, 0.5], b: [0, -1.0, 4.2], r: 0.7}, arc: {from: [0, 80], to: [0, -70], roll: 0, hand: r}}
