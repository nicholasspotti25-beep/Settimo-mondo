# Mazza (Randello del Pantano). Blunt and swinging: two hooking blows and an overhead smash; the heavy is a
# two-handed slam into the ground that hits around the impact point and crushes Equilibrio.
id: mazza
type: mazza
grip: one_hand
reach: 2.6
guard: {absorption: 0.65}
swings:
  mazza_light:
    - {id: mz_l1, anim: hook_r, startup: 0.24, active: 0.14, recovery: 0.4, cancel: 0.2, damage_mult: 1.1, poise: 0, shape: {type: arc, r: 2.6, angle: 110, y: [0.1, 2.4]}, move: {speed: 2.0, dur: 0.2}, arc: {from: [-80, 15], to: [60, -5], roll: -15, hand: r}}
    - {id: mz_l2, anim: hook_l, startup: 0.24, active: 0.14, recovery: 0.4, cancel: 0.2, damage_mult: 1.1, poise: 0, shape: {type: arc, r: 2.6, angle: 110, y: [0.1, 2.4]}, move: {speed: 2.0, dur: 0.2}, arc: {from: [65, 5], to: [-75, 10], roll: 15, hand: r}}
    - {id: mz_l3, anim: overhead, startup: 0.34, active: 0.14, recovery: 0.5, cancel: 0.26, damage_mult: 1.45, poise: 0, shape: {type: arc, r: 2.7, angle: 60, y: [0, 3.0]}, move: {speed: 2.6, dur: 0.24}, arc: {from: [0, 90], to: [0, -50], roll: 0, hand: r}}
  mazza_heavy:
    {id: mz_h, anim: slam_two_hand, startup: 0.55, active: 0.16, recovery: 0.6, cancel: 0.3, damage_mult: 2.0, poise: 30, shape: {type: cylinder, c: [0, -0.3, 1.9], r: 1.8, h: 2.8}, move: {speed: 2.0, dur: 0.3}, arc: {from: [0, 100], to: [0, -60], roll: 0, hand: both}}
  mazza_run:
    {id: mz_r, anim: hook_r, startup: 0.24, active: 0.15, recovery: 0.48, damage_mult: 1.3, poise: 0, shape: {type: arc, r: 2.6, angle: 130, y: [0.1, 2.4]}, move: {speed: 6.5, dur: 0.3}, arc: {from: [-90, 20], to: [60, -5], roll: -20, hand: r}}
  mazza_jump:
    {id: mz_j, anim: plunge_smash, startup: 0.22, active: 0.18, recovery: 0.56, damage_mult: 1.7, poise: 25, shape: {type: cylinder, c: [0, -0.8, 1.0], r: 1.8, h: 2.8}, arc: {from: [0, 90], to: [0, -70], roll: 0, hand: both}}
