  arco_lungo_jump:
    {id: ar_j, anim: aerial_shot, startup: 0.2, active: 0.06, recovery: 0.45, damage_mult: 1.2, poise: 20, projectile: {kind: w_golden_arrow, speed: 40, radius: 0.22, life: 2.0, gravity: 6, homing: 1.0, count: 2, spread: 8}, arc: {from: [0, 0], to: [0, 0], roll: 0, hand: both}}
