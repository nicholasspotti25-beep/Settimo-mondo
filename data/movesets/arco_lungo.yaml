# Arco lungo (Piuma Reale). Arrows fly with gravity (light aim assist corrects only gently). Three nocked shots;
# heavy = full draw that pierces and flies flatter; jumping = paired arrows loosed downward.
id: arco_lungo
type: arco_lungo
grip: bow
reach: 30
guard: {absorption: 0.4}
swings:
