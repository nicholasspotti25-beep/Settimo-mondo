# Lancia (Lancia del Custode). Long-reach thrusts to keep the boss at the tip; light ends in a wide sweep;
# heavy = lunging thrust; running = cavalry charge (the Guardiano's own).
id: lancia
type: lancia
grip: polearm
reach: 4.4
guard: {absorption: 0.7}
swings:
  lancia_light:
    - {id: ln_l1, anim: thrust, startup: 0.2, active: 0.12, recovery: 0.38, cancel: 0.18, damage_mult: 1.0, poise: 0, shape: {type: capsule, a: [0, 1.3, 0.4], b: [0, 1.3, 4.4], r: 0.45}, move: {speed: 2.2, dur: 0.18}, arc: {from: [0, 0], to: [0, 0], roll: 0, hand: both}}
    - {id: ln_l2, anim: thrust_high, startup: 0.2, active: 0.12, recovery: 0.38, cancel: 0.18, damage_mult: 1.0, poise: 0, shape: {type: capsule, a: [0, 1.5, 0.4], b: [0, 1.9, 4.4], r: 0.45}, move: {speed: 2.2, dur: 0.18}, arc: {from: [-5, 5], to: [0, 8], roll: 0, hand: both}}
    - {id: ln_l3, anim: sweep_rl, startup: 0.26, active: 0.16, recovery: 0.5, cancel: 0.24, damage_mult: 1.15, poise: 0, shape: {type: arc, r: 4.2, r_in: 0.8, angle: 150, y: [0.2, 2.4]}, move: {speed: 1.6, dur: 0.2}, arc: {from: [-85, 0], to: [80, 0], roll: 0, hand: both}}
  lancia_heavy:
    {id: ln_h, anim: thrust_heavy, startup: 0.5, active: 0.16, recovery: 0.58, cancel: 0.3, damage_mult: 1.75, poise: 22, shape: {type: capsule, a: [0, 1.3, 0.4], b: [0, 1.3, 5.0], r: 0.6}, move: {speed: 6.5, dur: 0.35}, arc: {from: [0, 10], to: [0, 0], roll: 0, hand: both}}
  lancia_run:
    {id: ln_r, anim: charge_thrust, startup: 0.22, active: 0.18, recovery: 0.48, damage_mult: 1.3, poise: 0, shape: {type: capsule, a: [0, 1.3, 0.4], b: [0, 1.3, 4.8], r: 0.55}, move: {speed: 8.5, dur: 0.38}, arc: {from: [0, 0], to: [0, 0], roll: 0, hand: both}}
  lancia_jump:
    {id: ln_j, anim: plunge, startup: 0.2, active: 0.2, recovery: 0.55, damage_mult: 1.55, poise: 20, shape: {type: capsule, a: [0, -0.5, 0.6], b: [0, 0.2, 3.2], r: 0.8}, arc: {from: [0, 60], to: [0, -50], roll: 0, hand: both}}
