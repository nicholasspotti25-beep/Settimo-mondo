# Humanoid pose library (knights, giants, mages, the Portatore, dismounted riders).
# Bones: hips spine chest neck head jaw shoulder_l/r arm_l/r forearm_l/r hand_l/r thigh_l/r shin_l/r foot_l/r
#        cape_* hair_* tail_*. Rotations in degrees relative to rest (standing, arms hanging, facing +Z):
#   x = pitch (upright chains lean forward; hanging limbs swing BACK; forearm -x bends the elbow forward; shin +x bends knee)
#   y = turn toward the character's left;  z = roll (left arm rises sideways with +z, right arm with -z).
# root: [left, up, forward] in hip-height units. Weapon hand is the right hand (grip_r); shield/off hand is the left.
family: humanoid
aliases:
  tail_sweep: kick
  coil: grab
  rear_stomp: stomp
  swoop: dive
  bite: shield_bash
  attack: overhead
