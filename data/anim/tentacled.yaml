# Tentacled pose library: the Kraken (mantle + ring of tentacles rising from the water) and Cthulhu (humanoid titan with a
# tentacled face, leathery wings and a body dissolving into mist). One library drives both variants: each clip poses the
# kraken bones and the cthulhu bones (bones a variant lacks are ignored).
# Kraken:  root bone body (waterline); body > head (mantle tip); body > tent{i}_0..k (tentacles in a ring, i = 0.. n-1,
#          tent0 / tent{n-1} flank the front). Waves/bends on `tent*` drive every tentacle (`spread` desynchronises them).
# Cthulhu: humanoid bones (hips spine chest neck head jaw arm_l/r forearm_l/r hand_l/r ...) + head > face{i}_0..3 (face
#          tentacles hanging over the chest) + chest > wing_l_0..2 > wing_l_f{0,1,2}_0 (+ _r) + hips > mist{i}_0..2.
# axis 'radial' (bends/waves): + curls a chain down/outward away from the body axis, - up/inward (closing like a fist).
# Wings (rest SPREAD up and out): left wing +y folds it back, +z raises it; the right wing mirrors (-y, -z).
family: tentacled
aliases:
  attack: slam
  overhead: slam
  stomp: slam
  rear_stomp: slam
  leap: slam
  dive: slam
  swoop: slam
  thrust_heavy: grab
  coil: grab
  bite: grab
  throw: sweep_r
  tail_sweep: sweep_r
  kick: sweep_r
  claw_r: sweep_r
  claw_l: sweep_l
  shield_bash: thrust
  charge: thrust
  breath: roar
  howl: roar
  transition: roar
  cast: summon
