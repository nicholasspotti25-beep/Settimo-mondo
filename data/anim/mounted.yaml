# Mounted pose library: humanoid rider (bones prefixed rider_) on a quadruped steed (quadruped bone names).
# Root offsets/rotation drive the steed's body. With the actor flag 'dismounted' the rider plays the 'foot_' clips
# (the humanoid library with the rider_ prefix) and the root moves to rider_hips.
# Lance/weapon in the right fist (grip_r; +Z out of the fist): the weapon's pitch is the SUM of the x rotations of
# rider_arm_r + rider_forearm_r + rider_hand_r (0 = horizontal forward, -90 = straight up, +30 = 30 deg down).
family: mounted
includes:
  - {family: quadruped, clipPrefix: steed_}
  - {family: humanoid, bonePrefix: rider_, clipPrefix: foot_}
aliases:
  bite: thrust
  thrust_heavy: thrust
  claw_r: sweep_r
  claw_l: sweep_l
  tail_sweep: sweep_r
  spin: sweep_r
  slam: overhead
  stomp: rear_stomp
  shield_bash: charge
  dive: charge
  swoop: charge
  grab: thrust
  coil: thrust
  throw: thrust
  cast: roar
  summon: roar
  breath: roar
  howl: roar
  burrow: rear_stomp
  emerge: rear_stomp
  hover: idle
  fly: run
  attack: thrust
