# Bird / griffin pose library (Aquila Dorata, Grifone, harpies, ravens). Root bone: body (pelvis).
# Bones: body > chest > neck_0..2 > head > jaw (lower beak, +x opens); chest > wing_l_0 (humerus) > wing_l_1 (forearm)
#        > wing_l_2 (hand, primaries) (+ _r); body > tail_0 (fan; griffin: lion tail tail_0..4);
#        bird legs leg_l_0..2 / leg_r_0..2 (+x swings a leg BACK); griffin legs leg_fl/fr_0..2 (eagle) and leg_bl/br_0..2 (lion).
# Wings rest SPREAD. LEFT wing (pointing +X): +z raises it (upstroke), -z lowers it, +y sweeps it BACK, -y forward.
# RIGHT wing mirrors: -z raises, +y sweeps it FORWARD. Folded (idle/walk): humerus back, forearm forward, hand back.
family: bird
aliases:
  attack: bite
  thrust: bite
  thrust_heavy: charge
  throw: bite
  tail_sweep: sweep_r
  kick: claw_r
  stomp: slam
  rear_stomp: slam
  overhead: slam
  coil: grab
  shield_bash: charge
  howl: roar
  transition: roar
  summon: cast
  burrow: dive
  emerge: leap
