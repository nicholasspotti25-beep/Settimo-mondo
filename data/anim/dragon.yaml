# Dragon pose library (Drago Rosso, Drago di Ghiaccio, Drago Tricefalo, Re/Regina Drago, Drago del Vuoto, wyverns).
# Root bone: body (pelvis; rearing pivots over the hind legs: rootRot x < 0 rears up, > 0 pitches the nose down).
# Bones: body > spine > chest; chest > neck{sfx}_0..k > head{sfx} > jaw{sfx} (sfx '' | _l | _r; globs neck* head* jaw*
#        drive every head); legs leg_fl/fr_0..2 (front, from the chest; absent on wyverns) and leg_bl/br_0..2 (hind);
#        body > tail_0..m (+x LIFTS the tail, +y swings it to the dragon's RIGHT); chest > wing_l_0 (humerus) >
#        wing_l_1 (forearm) > wing_l_2 (wrist) > wing_l_f0..2_0..1 (fingers); wing_l_b_0..1 (membrane edge) (+ _r).
# Wings rest SPREAD. LEFT wing: +z raises (upstroke), +y sweeps it BACK; RIGHT wing mirrors (-z raises, -y back).
# Folded on the ground (idle/walk/run): humerus up-back, forearm forward, fingers back: the wing tips tent over the back.
# Hanging legs: +x swings a leg BACK. Neck: +x leans forward/down, -x rears it; head +x nods down; jaw +x opens.
family: dragon
aliases:
  attack: bite
  thrust: bite
  thrust_heavy: charge
  overhead: rear_stomp
  slam: rear_stomp
  stomp: rear_stomp
  sweep_r: claw_r
  sweep_l: claw_l
  kick: tail_sweep
  throw: tail_sweep
  coil: grab
  shield_bash: charge
  howl: roar
  cast: roar
  summon: roar
  transition: roar
  emerge: roar
  burrow: dive
clips:
  idle:
    pose:
      wing_l_0: [0, 80, 25]
      wing_r_0: [0, -80, -25]
      wing_l_1: [0, -160, 0]
      wing_r_1: [0, 160, 0]
      wing_l_2: [0, 150, 0]
      wing_r_2: [0, -150, 0]
      wing_l_f*: [0, 6, -6]
      wing_r_f*: [0, -6, 6]
      neck*: [-2, 0, 0]
      head*: [8, 0, 0]
      tail*: [3, 0, 0]
      leg_fl_1: [-3, 0, 0]
      leg_fr_1: [-3, 0, 0]
    cycle:
      period: 4
      root: {y: [0.01, 0]}
      bones:
        chest: {x: [-1.6, 0]}
        neck*: {x: [1.4, 0.2], y: [1.6, 0.6]}
        head*: {y: [4, 0.4]}
        jaw*: {x: [2, 0.3, pos]}
        wing_l_0: {z: [1.5, 0.05]}
        wing_r_0: {z: [-1.5, 0.05]}
    waves:
      - {chain: tail, axis: y, amp: 4, wavelength: 6, period: 4}
  walk:
