# Insect pose library (Mantide Regina, Scarabeo Imperiale, Formica Regina, giant wasps, spiders). Root bone: body (thorax).
# Bones: body > abd_0..2 (abdomen toward -Z: +x LIFTS it, -x curls it under); body > chest (prothorax; mantis: raised)
#        > head > mand_l / mand_r (mandibles: left +y opens, -y closes; right mirrored), ant_l_0..2 / ant_r_0..2;
#        legs leg_l{i}_0..2 / leg_r{i}_0..2, i = 0 front .. 3 (spiders); mantis: the front pair is scythe_l_0..2 /
#        scythe_r_0..2 (scythe_*_0 points forward from the prothorax: -x raises it; scythe_*_1 hangs: -x swings it forward
#        = blade extended, +x folds it back); beetle elytra_l / elytra_r (+z left / -z right opens them); wing_l_0 / wing_r_0.
# Legs point sideways: a LEFT leg swings back with +y and lifts with +z; a RIGHT leg mirrors (-y back, -z lifts).
# Gait: alternating tripods A = l0 r1 l2 r3, B = r0 l1 r2 l3 (mantis: the scythes stay folded and the four legs walk).
family: insect
aliases:
  attack: bite
  overhead: slam
  stomp: slam
  rear_stomp: slam
  claw_r: sweep_r
  claw_l: sweep_l
  throw: sweep_r
  coil: grab
  thrust_heavy: grab
  kick: tail_sweep
  shield_bash: charge
  howl: roar
  transition: roar
  summon: cast
  swoop: dive
