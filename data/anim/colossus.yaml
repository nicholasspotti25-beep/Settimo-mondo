# Colossus pose library (Mostro della Palude, Mostro di Magma, fire giants, ice golems): the humanoid skeleton with heavy
# proportions (long arms, short legs, hunched). Extends humanoid: every humanoid clip exists; the clips below replace
# the ones that must read as WEIGHT on a phone screen — long, low anticipation (the root sinks and the torso coils
# before every blow), a short snap, and a recovery that stays bent (the punish window is visible: fists on the ground,
# torso low). Bones: hips spine chest neck head jaw shoulder_l/r arm_l/r forearm_l/r hand_l/r thigh_l/r shin_l/r
# foot_l/r. x = pitch (upright chain leans forward; hanging limb swings BACK), y = turn left, z = roll (left arm rises
# sideways with +z, right arm with -z). root: [left, up, forward] in hip-height units.
family: colossus
extends: humanoid
aliases:
  attack: overhead
  eruption: summon
  long_reach: thrust
  mire_arms: grab
  double_slam: slam
  mud_wave: slam
  submerge: burrow
  tail_sweep: sweep_r
  coil: grab
  bite: grab
