        arm_r: [-6, 0, -10]
        forearm_r: [-24, 0, 0]
    active:
      pose:
        neck: [-14, 0, 0]
        head: [-22, 0, 0]
        chest: [-6, 0, 0]
        arm_l: [-90, -36, 6]
        forearm_l: [-120, -20, 0]
