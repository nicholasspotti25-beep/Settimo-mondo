      hand_r: [34, 0, 0]
      arm_l: [-48, 0, -28]
      forearm_l: [-34, 0, 0]
    cycle:
      stride: 1.55
      root: {y: [0.022, 0.125, double], x: [0.012, 0]}
      rootRot: {y: [5, 0], z: [2, 0]}
      bones:
        thigh_l: {x: [-27, 0]}
        thigh_r: {x: [27, 0]}
        shin_l: {x: [34, 0.82, pos]}
        shin_r: {x: [34, 0.32, pos]}
        foot_l: {x: [-12, 0.05]}
        foot_r: {x: [12, 0.05]}
        arm_r: {x: [-3, 0]}
        arm_l: {x: [3, 0]}
        chest: {y: [-3, 0]}
  polearm_run:
    pose:
