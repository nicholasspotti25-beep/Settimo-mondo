        thigh_r: {x: [46, 0]}
        shin_l: {x: [70, 0.78, pos]}
        shin_r: {x: [70, 0.28, pos]}
        foot_l: {x: [-18, 0.05]}
        foot_r: {x: [18, 0.05]}
        arm_r: {x: [-5, 0]}
        arm_l: {x: [5, 0]}
        chest: {y: [-5, 0]}
  polearm_guard:
    base: guard
    pose:
      arm_r: [-14, 0, -14]
      forearm_r: [-74, 0, 0]
      hand_r: [30, 0, 0]
      arm_l: [-82, 0, -22]
      forearm_l: [-44, 0, 0]
  polearm_thrust:
