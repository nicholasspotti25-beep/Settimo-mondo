        forearm_l: [-60, 0, 0]
  swap:
    phases: [0.4, 0.7]
    telegraph:
      pose:
        chest: [-4, -14, 0]
        arm_r: [-150, -30, -30]
        forearm_r: [-110, 0, 0]
        hand_r: [0, 0, 0]
    active:
      pose:
        chest: [2, 10, 0]
        arm_r: [-50, 20, -20]
        forearm_r: [-60, 0, 0]
        hand_r: [40, 0, 0]
    recovery:
      pose:
        arm_r: [-14, 0, -8]
        forearm_r: [-34, 0, 0]
  transition_flourish:
    phases: [0.25, 0.7]
    telegraph:
      pose:
        spine: [6, -30, 0]
        chest: [0, -40, 0]
        arm_r: [-90, -40, -60]
        forearm_r: [-20, 0, 0]
        arm_l: [-40, 0, 40]
        thigh_l: [-30, 0, 10]
        shin_l: [40, 0, 0]
      root: [0, -0.14, 0]
    active:
      pose:
        spine: [10, 0, 0]
        arm_r: [-88, 0, -80]
        forearm_r: [-4, 0, 0]
        hand_r: [60, 0, 0]
        arm_l: [-60, 0, 80]
      root: [0, -0.1, 0.1]
      cycle:
