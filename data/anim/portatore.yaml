      forearm_l: [-34, 0, 0]
      thigh_l: [-14, 6, 6]
      shin_l: [14, 0, 0]
      foot_l: [2, -6, 0]
      thigh_r: [8, -10, -6]
      shin_r: [10, 0, 0]
      foot_r: [-6, 10, 0]
    root: [0, -0.03, 0]
    cycle:
      period: 3.8
      root: {y: [0.005, 0]}
      bones:
        chest: {x: [1.4, 0]}
        neck: {x: [-0.7, 0.1]}
        head: {y: [2.5, 0.3]}
  polearm_walk:
