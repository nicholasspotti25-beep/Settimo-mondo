  # --- Polearms (MovesetDef.grip 'polearm': lance, halberd, harpoon, scythe, naginata, trident, drill) -----------------
  # Selected through the 'polearm' flag -> 'polearm_' prefix (PortatoreVisual). The right hand is the rear hand at the hip,
  # the left hand rides the shaft in front; the weapon's +Z leaves the right fist, so the tip direction is set by the
  # summed pitch of arm_r + forearm_r + hand_r (0 = level forward, negative = tip up) plus the torso lean. Unlisted
  # swings resolve to the plain clips (thrust_high -> polearm_thrust, charge_thrust -> polearm_charge, ...).
  polearm_idle:
    pose:
      spine: [3, -8, 0]
      chest: [2, -12, 0]
      neck: [-2, 10, 0]
      head: [-4, 8, 0]
      arm_r: [10, 0, -12]
      forearm_r: [-60, 0, 0]
