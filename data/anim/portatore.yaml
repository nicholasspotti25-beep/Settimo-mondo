# The Portatore: the humanoid library plus player-only actions. Weapon swings resolve their SwingDef.anim keyword
# against these clips (slash_rl -> sweep_r, plunge -> slam, ...). One-shot actions play on the render-only 'action' stage
# over the state's duration; `phases` = fractions of the duration where the wind-up and the strike end.
family: portatore
extends: humanoid
aliases:
  roll: dodge_roll
  dodge: dodge_roll
  meditate: kneel
  interact: kneel
  grabbed: locked
  ballista: guard
  fall: jump
  transizione: transition_flourish
  art: art_raise
clips:
  idle:
    pose:
      spine: [2, 2, 0]
      chest: [1, 6, 0]
      neck: [-2, -2, 0]
      head: [-4, -6, 0]
      arm_l: [-4, 0, 8]
      arm_r: [-8, 4, -6]
      forearm_l: [-12, 0, 0]
      forearm_r: [-30, -4, 0]
      hand_r: [24, 0, 0]
      thigh_l: [-5, 6, 3]
      thigh_r: [3, -8, -3]
      shin_l: [8, 0, 0]
      shin_r: [6, 0, 0]
      foot_l: [-3, -4, 0]
      foot_r: [-9, 6, 0]
    root: [0, -0.015, 0]
    cycle:
      period: 3.8
      root: {y: [0.005, 0]}
      bones:
        chest: {x: [1.4, 0]}
        neck: {x: [-0.7, 0.1]}
        arm_l: {z: [1.0, 0.05]}
        arm_r: {z: [-1.0, 0.05]}
        head: {y: [2.5, 0.3]}
  guard:
    pose:
      spine: [8, 12, 0]
      chest: [4, 14, 0]
      neck: [-6, -10, 0]
      head: [-6, -8, 0]
      arm_r: [-48, 20, -12]
      forearm_r: [-84, 0, 0]
      hand_r: [-20, 0, 0]
      arm_l: [-58, 10, 20]
      forearm_l: [-96, 0, 0]
      thigh_l: [-26, 0, 8]
      shin_l: [36, 0, 0]
      thigh_r: [14, 0, -8]
      shin_r: [30, 0, 0]
    root: [0, -0.1, -0.02]
  parry:
    phases: [0.18, 0.5]
    telegraph:
      pose:
        spine: [2, 20, 0]
        chest: [-2, 26, 0]
        arm_r: [-60, 40, -30]
        forearm_r: [-60, 0, 0]
        hand_r: [-30, 0, 0]
        arm_l: [-20, 0, 30]
        forearm_l: [-40, 0, 0]
      root: [0, -0.06, -0.04]
    active:
      pose:
        spine: [6, -20, 0]
        chest: [4, -30, 0]
        arm_r: [-80, -30, -40]
        forearm_r: [-30, 0, 0]
        hand_r: [-40, 0, 0]
        arm_l: [-10, 0, 30]
        thigh_l: [-24, 0, 8]
        shin_l: [30, 0, 0]
      root: [0, -0.08, 0.04]
    recovery:
      pose:
        spine: [4, -6, 0]
        arm_r: [-40, 0, -14]
        forearm_r: [-50, 0, 0]
  counter:
    base: thrust
  dodge_roll:
    phases: [0.12, 0.8]
    telegraph:
      pose:
        spine: [30, 0, 0]
        chest: [20, 0, 0]
        neck: [20, 0, 0]
        arm_l: [-40, 0, 20]
        arm_r: [-40, 0, -20]
        forearm_l: [-90, 0, 0]
        forearm_r: [-90, 0, 0]
        thigh_l: [-70, 0, 6]
        thigh_r: [-50, 0, -6]
        shin_l: [100, 0, 0]
        shin_r: [90, 0, 0]
      root: [0, -0.3, 0]
    active:
      blend: 0.2
      pose:
        spine: [40, 0, 0]
        chest: [30, 0, 0]
        neck: [30, 0, 0]
        head: [20, 0, 0]
        arm_l: [-60, 0, 10]
        arm_r: [-60, 0, -10]
        forearm_l: [-110, 0, 0]
        forearm_r: [-110, 0, 0]
        thigh_l: [-120, 0, 8]
        thigh_r: [-120, 0, -8]
        shin_l: [140, 0, 0]
        shin_r: [140, 0, 0]
      root: [0, -0.5, 0]
    recovery:
      pose:
        spine: [20, 0, 0]
        thigh_l: [-50, 0, 8]
        thigh_r: [-20, 0, -8]
        shin_l: [70, 0, 0]
        shin_r: [60, 0, 0]
        arm_l: [-20, 0, 20]
        arm_r: [-20, 0, -20]
      root: [0, -0.2, 0]
  backstep:
