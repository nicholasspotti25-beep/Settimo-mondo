        rootRot: {y: [170, 0]}
    recovery:
      pose:
        spine: [6, 0, 0]
        arm_r: [-40, 0, -20]
        forearm_r: [-50, 0, 0]
  art_raise:
    phases: [0.35, 0.7]
    hold: 1.5
    telegraph:
      pose:
        spine: [-6, 0, 0]
        chest: [-10, 0, 0]
        head: [-12, 0, 0]
        arm_r: [-150, 0, -12]
        forearm_r: [-30, 0, 0]
        hand_r: [30, 0, 0]
        arm_l: [-40, 0, 40]
        forearm_l: [-40, 0, 0]
        thigh_l: [-20, 0, 8]
        shin_l: [24, 0, 0]
      root: [0, -0.04, 0]
    active:
      pose:
        spine: [20, 0, 0]
        chest: [14, 0, 0]
        arm_r: [-70, 0, -8]
        forearm_r: [-8, 0, 0]
