# Tree pose library (Elder Tree, treants, plant colossi). Root bone: trunk_0 (the whole tree sways and topples at the base).
# Bones: trunk_0..3 (vertical) > crown_0..1; trunk_2 > branch_l_0..2 (left arm-branch, pointing +X) / branch_r_0..2;
#        trunk_3 > branch_l2_0..1 / branch_r2_0..1 (upper branches); trunk_1 > jaw (bark mouth, +x opens);
#        root > rootl_{i}_0..1 (surface roots, radial; the 6-root rig of the family builder is assumed for per-root lifts).
# Trunk/crown: +x leans forward, y turns left, z tilts to the right. LEFT branch (pointing +X): +z raises it, -y swings it
# forward, +y back. RIGHT branch: mirrored (-z raises, +y forward). Curling a branch toward the front: left -y, right +y.
# Lifting a root i (at angle a_i = i*60 + 17.2 deg around the trunk): x = -k cos a_i, z = +k sin a_i.
family: tree
aliases:
  attack: slam
  overhead: slam
  rear_stomp: stomp
  kick: stomp
  leap: slam
  dive: slam
  swoop: slam
  claw_r: sweep_r
  claw_l: sweep_l
  tail_sweep: spin
  throw: sweep_r
  thrust_heavy: charge
  shield_bash: charge
  coil: grab
  howl: roar
  cast: summon
  transition: roar
  root_call: summon
  heart_pulse: roar
  shake_canopy: shake
  hover: idle
  fly: walk
