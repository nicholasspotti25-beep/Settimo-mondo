    active: 0.35
    recovery: 1.55
    damage_mult: 1.3
    poise: 26
    flags: [knockdown]
    element: fire
    range: [0, 9]
    weight: 1.3
    cooldown: 2.5
    track: 1.1
    hits:
      - {t: 0.04, dur: 0.2, shape: {type: cylinder, c: [-1.6, 0, 5.4], r: 3.1, h: 3.5}}
