# 11. Mostro di Magma — secondary · Fucine Sepolte · D9.
# A colossus of rock and lava among the giant anvils of the buried forge: glowing cracks, a heart that pulses in its chest.
# Slow, devastating blows; lava bursts from the ground; an ERUPTION that floods the whole arena with magma (only the black
# crusts of cooled basalt it raises stay safe: they appear first, run to one). The heart is a weak point in phase 1 when the
# colossus bends over a slam. Phase 2: it solidifies into an OBSIDIAN CARAPACE (breakable part: damage to the body is
# reduced until it shatters); shattering it exposes the heart (a far weaker point).
# Built by the Three Knights to guard the forge where the armor of the Fallen was beaten.
# Local frame: +Z forward, +Y up, +X = the colossus's LEFT.
id: mostro_di_magma
order: 11
name_key: boss.mostro_di_magma.name
class: secondary
difficulty: 9
act: 2
arena: fucine_incudini
zone: fucine_sepolte
model: {builder: mostro_di_magma, rig: colossus, scale: 1.0, palette: act2_red_blue_black}
equilibrio_max: 230
body: {radius: 3.3, height: 11.0, mass: immovable}
hurtboxes:
