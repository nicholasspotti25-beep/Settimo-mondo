  - {id: heart_exposed, name_key: part.mostro_di_magma.heart, hurt: [{c: [0, 6.6, 1.7], r: 1.2}], damage_mult: 2.2, poise_mult: 1.6, lockable: true, active: false}
  - id: carapace
    name_key: part.mostro_di_magma.carapace
    hurt:
      - {c: [1.7, 1.6, 0], r: 1.7}
      - {c: [-1.7, 1.6, 0], r: 1.7}
      - {c: [0, 3.9, 0], r: 2.25}
      - {c: [0, 6.4, 0.3], r: 2.75}
    hp: 0.15
    main_share: 0.35
    poise_mult: 0.6
    active: false
