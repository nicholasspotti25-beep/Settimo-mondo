  # Lava bursts from the ground: under your feet first, then around you.
  - id: lava_burst
    anim: summon
    telegraph: 0.85
    active: 1.3
    recovery: 1.0
    damage_mult: 1.0
    poise: 20
    flags: [burn]
    element: fire
    range: [0, 34]
    weight: 1.0
    cooldown: 5
    spawns:
      - {t: 0.0, type: hazard, id: magma_geyser, at: target_predict, delay: 1.0, active: 0.6, damage_mult: 1.0, shape: {type: cylinder, c: [0, 0, 0], r: 2.4, h: 7}}
