  - {c: [-1.7, 1.6, 0], r: 1.55}    # right leg
  - {c: [0, 3.9, 0], r: 2.1}        # pelvis
  - {c: [0, 6.4, 0.3], r: 2.6}      # torso
  - {c: [0, 9.4, 0.7], r: 1.25}     # head
