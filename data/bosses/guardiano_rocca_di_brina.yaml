    track: 1.2
    hits:
      - {t: 0.02, dur: 0.2, shape: {type: box, c: [0.6, 2.4, 3.6], half: [2.6, 2.4, 1.6]}}
    sfx: brina_bash
  # The answer to light-attack spam on the shield (behavior only, never in the patterns): a faster bash, still telegraphed
