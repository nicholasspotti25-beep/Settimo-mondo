# 15. Guardiano della Rocca di Brina — secondary · the gate of the ice castle · D11.
# A gigantic EMPTY armor made of ice: a tower shield, a small sword, frost in the joints. Defensive: the tower shield blocks
# almost everything that comes from the front (behavior modifyIncoming) and punishes light-attack spam (three light blows
# on the shield in a short time and he answers at once with a fast shield bash). Equilibrio must be broken to open a gap:
# heavy blows on the shield still push his Equilibrio; once Spezzato the shield drops and the armor is open.
# Phase 2: the shield shatters into blades that orbit him (flag blades_orbit; bstate.bladeAngle for the renderer); the
# blades whirl out in a ring, fly at you and come down as a cyclone. The body takes full damage.
# Loki's porter, bound by an oath he does not remember. Falling he says "Finalmente" and crumbles.
# Local frame: +Z forward, +Y up, +X = the armor's LEFT (shield arm). Height ~6.8 m.
id: guardiano_rocca_di_brina
order: 15
name_key: boss.guardiano_rocca_di_brina.name
title_key: boss.guardiano_rocca_di_brina.title
class: secondary
difficulty: 11
act: 3
arena: rocca_cancello
zone: rocca_brina
model: {builder: guardiano_rocca_di_brina, rig: humanoid, scale: 1.0, palette: act3_white_azure}
equilibrio_max: 190
body: {radius: 2.2, height: 6.8, mass: immovable}
hurtboxes:
  - {c: [0.9, 1.2, 0], r: 1.0}      # left leg
  - {c: [-0.9, 1.2, 0], r: 1.0}     # right leg
  - {c: [0, 2.8, 0], r: 1.4}        # hips
  - {c: [0, 4.4, 0.2], r: 1.7}      # chest
  - {c: [0, 6.0, 0.3], r: 0.8}      # helm
  - {c: [1.5, 2.6, 1.5], r: 1.6}    # tower shield (left arm)
move: {walk: 1.9, run: 4.0, turn: 1.9, preferred_range: [2, 6]}
idle_gap: [0.9, 1.5]
music: boss_guardiano_rocca_di_brina
intro_sequence: guardiano_brina_intro
defeat_sequence: guardiano_brina_defeat
lore_key: boss.guardiano_rocca_di_brina.lore
phases:
  - id: p1
    hp_range: [1.0, 0.5]
    music: boss_guardiano_rocca_di_brina_p1
    opener: shield_charge
    patterns: [sword_thrust, sword_cut, overhead_cleave, shield_bash, shield_charge, frost_slam, back_sweep]
  - id: p2
    hp_range: [0.5, 0.0]
    music: boss_guardiano_rocca_di_brina_p2
    on_enter: [shield_broken, blades_orbit]
    dialogue: boss.guardiano_rocca_di_brina.mid
    transition: 3.0
    speed_mult: 1.08
    aggression: 1.15
    opener: blade_whirl
    patterns: [sword_thrust, sword_cut, overhead_cleave, frost_slam, back_sweep, blade_whirl, blade_volley, blade_cyclone]
attacks:
