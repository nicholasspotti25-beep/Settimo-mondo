    spawns:
      - {t: 0.05, type: hazard, id: brina_line, at: front, dist: 8.5, delay: 0.35, active: 0.35, damage_mult: 0.7, shape: {type: box, c: [0, 0, 0], half: [1.0, 1.5, 1.6]}}
