  - id: sword_thrust
    anim: thrust
    telegraph: 0.65
    active: 0.22
    recovery: 0.95
    damage_mult: 1.0
    poise: 18
    flags: []
    element: ice
    range: [0, 6]
    weight: 1.3
    cooldown: 2
    track: 1.2
    hits:
      - {t: 0.02, dur: 0.18, shape: {type: capsule, a: [-0.8, 2.6, 1.5], b: [-0.6, 2.4, 7.2], r: 0.9}}
    sfx: brina_thrust
  # A flat cut over the rim of the shield.
  - id: sword_cut
    anim: sweep_r
    telegraph: 0.8
    active: 0.3
    recovery: 1.05
    damage_mult: 1.1
    poise: 20
    flags: []
    element: ice
    range: [0, 5.5]
    weight: 1.1
    cooldown: 2.5
    track: 1.1
    track_active: 0.15
    hits:
      - {t: 0.03, dur: 0.24, shape: {type: arc, r: 6.2, angle: 150, yaw: -10, y: [0, 4]}}
    sfx: brina_cut
  # Colpo Rosso: the sword rises over the shield and comes down with all the weight of the armor.
  - id: overhead_cleave
    anim: overhead
    telegraph: 1.15
    active: 0.3
    recovery: 1.5
    damage_mult: 1.5
    poise: 30
    flags: [red, knockdown]
