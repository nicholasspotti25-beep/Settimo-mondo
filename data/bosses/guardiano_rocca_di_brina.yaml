  - id: shield_punish
    anim: shield_bash
    telegraph: 0.45
    active: 0.25
    recovery: 1.1
    damage_mult: 1.0
    poise: 28
    flags: [knockback]
    range: [0, 6]
    weight: 0.01
    track: 1.4
    motion:
      - {t: -0.1, dur: 0.25, type: forward, speed: 6}
    hits:
      - {t: 0.02, dur: 0.2, shape: {type: box, c: [0.6, 2.4, 3.6], half: [2.8, 2.4, 1.9]}}
    sfx: brina_bash
  # He advances behind the shield like a wall of ice.
  - id: shield_charge
    anim: charge
    telegraph: 1.0
    active: 0.9
    recovery: 1.3
    damage_mult: 1.2
    poise: 28
    flags: [knockback]
    range: [5, 26]
    weight: 1.0
    cooldown: 6
    track: 1.3
    track_active: 0.1
    motion:
      - {t: 0, dur: 0.8, type: forward, speed: 11}
    hits:
      - {t: 0, dur: 0.8, shape: {type: capsule, a: [0.4, 1.4, 2.6], b: [0.4, 3.2, 3.2], r: 2.2}}
    sfx: brina_charge
  # The rim of the shield is driven into the ground: frost runs along the floor toward you.
  - id: frost_slam
    anim: slam
    telegraph: 1.0
    active: 1.2
    recovery: 1.1
    damage_mult: 1.0
    poise: 20
    flags: [slow]
    element: ice
    range: [3, 24]
    weight: 0.9
    cooldown: 6
    spawns:
      - {t: 0.0, type: hazard, id: brina_line, at: line_to_target, count: 5, dist: 3.6, delay: 0.85, active: 0.35, damage_mult: 1.0, flags: [slow], shape: {type: box, c: [0, 0, 0], half: [1.1, 1.5, 1.7]}}
    sfx: brina_frost
  # Whoever stays behind him: the armor turns on its waist and the sword sweeps its back.
  - id: back_sweep
    anim: spin
    telegraph: 0.75
    active: 0.3
    recovery: 1.1
    damage_mult: 1.1
    poise: 22
    flags: [knockback]
    element: ice
    range: [0, 6]
    weight: 1.4
    cooldown: 3.5
    hits:
      - {t: 0.03, dur: 0.24, shape: {type: arc, r: 6.4, angle: 210, yaw: 180, y: [0, 4]}}
    sfx: brina_spin
  # Phase 2: the orbiting blades whirl out in a widening ring. Jump it.
  - id: blade_whirl
    anim: spin
    telegraph: 0.9
    active: 1.0
    recovery: 1.1
    damage_mult: 0.9
    poise: 20
    flags: []
    element: ice
    range: [0, 12]
    weight: 1.0
    cooldown: 6
    spawns:
      - {t: 0.05, type: shockwave, id: blade_ring, from: [0, 0, 0], delay: 0.3, shape: {type: ring, r0: 2.6, r1: 13, width: 1.1, height: 0.7}, active: 0.9, damage_mult: 0.9}
    sfx: brina_blades
  # Phase 2: he flings the blades at you, one after the other.
  - id: blade_volley
    anim: cast
    telegraph: 0.85
    active: 0.9
    recovery: 1.1
    damage_mult: 0.8
    poise: 14
    flags: []
    element: ice
    range: [5, 30]
    weight: 1.0
    cooldown: 5
    track: 1.3
    spawns:
      - {t: 0.0, type: projectile, id: brina_blade, count: 1, speed: 20, from: [1.2, 3.2, 1.0]}
