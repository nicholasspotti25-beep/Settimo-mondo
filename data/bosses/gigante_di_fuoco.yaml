# 13. Gigante di Fuoco — secondary · Bocca del Vulcano · D10.
# A giant as tall as a tower: black rock skin, veins of fire, a beard of flames. He rises from the crater while the snow
# melts around him and fights on the crater rim, where the meltwater freezes again into a glaze on the basalt (the rim is
# slippery: surface ice) and the rim itself is unstable (his heavy blows crack it; slabs give way under marked ground;
# in phase 2 the outer edge has crumbled into the crater).
# Fists that ignite the ground (every fist blow leaves burning basalt for a few seconds), grabs and throws (behavior: the
# hand closes on you, lifts you and hurls you across the rim), ember breath (a slow sweeping cone).
# Phase 2: he covers himself in fire (flag ablaze) and charges head-down; after a charge his head hangs low, within reach.
# Sentinel between Inferno and Frost, tasked with keeping the infernal fire from rising: he is not evil, he obeys.
# Local frame: +Z forward, +Y up, +X = the giant's LEFT. Height ~16 m.
