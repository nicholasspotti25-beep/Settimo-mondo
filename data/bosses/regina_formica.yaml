# 25. Regina Formica — secondary · Little Garden, Formicaio sotto le radici (third gate) · D14. Mute (captions only).
# A gigantic ant with a swollen golden abdomen, surrounded by luminous eggs. She avoids melee (keeps 2–5 m away; a shove
# and the eggs' pulse answer whoever hugs her): spits acid (fans aimed low at the tiny player, puddles that burn a few
# seconds) and sends WAVES OF WORKERS across the arena: a low marching line (0.36 m high: JUMP it, or roll through it)
# laid by the behavior from the rim through your position, crossing the view from the side. While a wave is still coming
# at you she does not strike (one threat at a time).
# Phase 2 (flag tunnels, arena_state tunnels): she digs (hidden, untargetable) and a hole opens under your feet (marked
# 1.1 s); she bursts out of it and stays surfaced there (long punish window).
# Guards the last gate: behind the anthill is the underground passage to Uruk's greenhouse.
# Local frame: +Z forward, +Y up, +X = her LEFT. ~5.5 m long, head at 1.6 m; six low leg hurtboxes, abdomen touching the
# ground behind her.
id: regina_formica
order: 25
name_key: boss.regina_formica.name
title_key: boss.regina_formica.title
class: secondary
difficulty: 14
act: 4
arena: giardino_formicaio
zone: little_garden
model: {builder: regina_formica, rig: insectoid, scale: 1.0, palette: act4_vivid}
equilibrio_max: 180
body: {radius: 1.2, height: 2.0, mass: heavy}
hurtboxes:
  - {c: [1.1, 0.3, 0.9], r: 0.5}      # left fore leg
  - {c: [-1.1, 0.3, 0.9], r: 0.5}     # right fore leg
  - {c: [1.2, 0.3, -0.2], r: 0.5}     # left mid leg
  - {c: [-1.2, 0.3, -0.2], r: 0.5}    # right mid leg
  - {c: [1.0, 0.3, -1.2], r: 0.5}     # left hind leg
  - {c: [-1.0, 0.3, -1.2], r: 0.5}    # right hind leg
  - {c: [0, 0.4, 2.2], r: 0.45}       # mandibles
  - {c: [0, 1.4, 1.9], r: 0.6}        # head
  - {c: [0, 1.2, 0.4], r: 0.7}        # thorax
  - {c: [0, 0.9, -2.3], r: 1.2}       # swollen golden abdomen
move: {walk: 1.1, run: 2.4, turn: 2.2, preferred_range: [2.0, 5.0]}
idle_gap: [1.0, 1.5]
music: boss_regina_formica
intro_sequence: regina_formica_intro
defeat_sequence: regina_formica_defeat
lore_key: boss.regina_formica.lore
phases:
  - id: p1
    hp_range: [1.0, 0.5]
    music: boss_regina_formica_p1
    opener: worker_wave
    patterns: [acid_spit, acid_arc, worker_wave, mandible_shove, egg_pulse]
  - id: p2
    hp_range: [0.5, 0.0]
    music: boss_regina_formica_p2
    on_enter: [tunnels]
    arena_state: tunnels
    transition: 2.5
    speed_mult: 1.05
    aggression: 1.1
    opener: burrow
    patterns: [acid_spit, acid_arc, worker_wave, mandible_shove, egg_pulse, burrow]
attacks:
  # She rears and spits a fan of acid (aimed low at you; gaps between the drops).
  - id: acid_spit
    anim: spit
    telegraph: 0.75
    active: 0.4
    recovery: 1.0
    damage_mult: 0.8
    poise: 12
    flags: []
    range: [1.5, 30]
    weight: 1.2
    cooldown: 3
    track: 1.2
    spawns:
      - {t: 0.05, type: projectile, id: regina_acid, count: 3, spread: 26, speed: 7, from: [0, 1.5, 2.2], status: {kind: poison, dur: 3}}
      - {t: 0.05, type: custom, event: aim_acid}
    sfx: regina_spit
  # A lobbed glob: the puddle is marked where you are going, then it burns for a few seconds.
  - id: acid_arc
    anim: spit_high
    telegraph: 0.9
    active: 0.6
    recovery: 1.1
    damage_mult: 0.45
    poise: 0
    flags: []
    range: [2, 30]
    weight: 1.0
    cooldown: 6
    track: 1.0
    spawns:
      - {t: 0.0, type: hazard, id: regina_acid_pool, at: target_predict, delay: 1.1, active: 2.5, flags: [dot], status: {kind: poison, dur: 2}, shape: {type: cylinder, c: [0, 0, 0], r: 0.9, h: 0.6}}
      - {t: 0.3, type: hazard, id: regina_acid_pool, at: random_arena, count: 1, delay: 1.1, active: 2.5, flags: [dot], status: {kind: poison, dur: 2}, shape: {type: cylinder, c: [0, 0, 0], r: 0.9, h: 0.6}}
    sfx: regina_spit
  # Antennae raised, she drums the ground: a line of workers pours out of the rim and marches across the arena through
  # your position (low: jump it). Laid by the behavior (workers_place).
  - id: worker_wave
    anim: summon
    telegraph: 1.0
    active: 0.8
    recovery: 0.8
    damage_mult: 1.0
    poise: 24
    flags: []
    global: true
    range: [0, 30]
    weight: 1.1
    cooldown: 7
    spawns:
      - {t: 0.0, type: hazard, id: regina_workers, at: self, count: 5, speed: 3.5, delay: 0.8, active: 6.5, shape: {type: box, c: [0, 0.18, 0], half: [1.2, 0.18, 0.35]}}
      - {t: 0.0, type: custom, event: workers_place}
    sfx: regina_drum
  # Whoever hugs her: a sideways shove of the head and mandibles, then she skitters back.
  - id: mandible_shove
    anim: shove
    telegraph: 0.7
    active: 0.9
    recovery: 0.9
    damage_mult: 1.0
    poise: 22
    flags: [knockback]
    range: [0, 1.6]
    weight: 1.6
    cooldown: 3
    track: 1.2
    track_active: 0.1
    hits:
      - {t: 0.04, dur: 0.2, shape: {type: arc, r: 2.6, angle: 120, yaw: 0, y: [0, 1.6]}}
    motion:
      - {t: 0.3, dur: 0.6, type: retreat, speed: 3.5}
    sfx: regina_shove
  # The luminous eggs around her pulse with acid light (marked ring around her body): step away.
  - id: egg_pulse
    anim: egg_pulse
    telegraph: 0.9
    active: 1.4
    recovery: 1.0
    damage_mult: 0.9
    poise: 18
    flags: []
    range: [0, 2.5]
    weight: 1.0
    cooldown: 6
    spawns:
      - {t: 0.0, type: hazard, id: regina_egg_burst, at: ring_self, count: 6, dist: 1.6, delay: 1.0, active: 0.35, shape: {type: cylinder, c: [0, 0, 0], r: 0.75, h: 1.2}}
    sfx: regina_eggs
  # Phase 2: she curls and digs into the soil (hidden, untargetable) → tunnel_strike.
  - id: burrow
    anim: burrow
    telegraph: 0.8
    active: 0.8
    recovery: 0.05
    damage_mult: 0
    poise: 0
    flags: []
    global: true
    range: [0, 30]
    weight: 1.0
    cooldown: 9
    combo_next: tunnel_strike
    combo_chance: 1
    spawns:
      - {t: 0.6, type: custom, event: dig}
    sfx: regina_dig
  # A hole opens under your feet (marked 1.1 s) and she bursts out of it; she stays there, surfaced (punish window).
  - id: tunnel_strike
    anim: emerge
    telegraph: 0.4
    active: 1.5
    recovery: 1.8
    damage_mult: 1.3
    poise: 30
    flags: [knockdown]
    global: true
    range: [0, 30]
    weight: 0.01
    cooldown: 0
    spawns:
      - {t: 0.0, type: hazard, id: regina_hole, at: target, delay: 1.1, active: 0.3, flags: [knockdown], shape: {type: cylinder, c: [0, 0, 0], r: 1.0, h: 2.5}}
      - {t: 1.1, type: custom, event: emerge}
    sfx: regina_emerge
  # New Game+ (phase 1): two marching lines, one behind the other (jump the first, land, jump the second).
  - id: ng_twin_wave
    anim: summon
    telegraph: 1.0
    active: 0.8
    recovery: 0.8
    damage_mult: 1.0
    poise: 24
    flags: []
    global: true
    range: [0, 30]
    weight: 0.8
    cooldown: 12
    spawns:
      - {t: 0.0, type: hazard, id: regina_workers, at: self, count: 5, speed: 3.5, delay: 0.8, active: 8.0, shape: {type: box, c: [0, 0.18, 0], half: [1.2, 0.18, 0.35]}}
      - {t: 0.0, type: custom, event: workers_place}
      - {t: 0.0, type: hazard, id: regina_workers, at: self, count: 5, speed: 3.5, delay: 0.8, active: 8.0, shape: {type: box, c: [0, 0.18, 0], half: [1.2, 0.18, 0.35]}}
      - {t: 0.0, type: custom, event: workers_place_second}
    sfx: regina_drum
  # New Game+ (phase 2): two holes in a row — she bursts out, digs again, and a second hole opens under you.
  - id: ng_burrow
    anim: burrow
    telegraph: 0.8
    active: 0.8
    recovery: 0.05
    damage_mult: 0
    poise: 0
    flags: []
    global: true
    range: [0, 30]
    weight: 0.8
    cooldown: 14
    combo_next: ng_tunnel_chain
    combo_chance: 1
    spawns:
      - {t: 0.6, type: custom, event: dig}
    sfx: regina_dig
  - id: ng_tunnel_chain
    anim: emerge
    telegraph: 0.4
    active: 1.5
    recovery: 0.5
    damage_mult: 1.2
    poise: 30
    flags: [knockdown]
    global: true
    range: [0, 30]
    weight: 0.01
    cooldown: 0
    combo_next: burrow
    combo_chance: 1
    spawns:
      - {t: 0.0, type: hazard, id: regina_hole, at: target, delay: 1.1, active: 0.3, flags: [knockdown], shape: {type: cylinder, c: [0, 0, 0], r: 1.0, h: 2.5}}
      - {t: 1.1, type: custom, event: emerge}
    sfx: regina_emerge
time_of_day_variants:
  alba: {opener: acid_arc, weights: {worker_wave: 0.7, egg_pulse: 1.4}, flags: [tending], note_key: boss.regina_formica.tod.alba}
  notte: {opener: worker_wave, weights: {worker_wave: 1.5}, flags: [eggs_bright], note_key: boss.regina_formica.tod.notte}
dialogue_keys: []
drops_weapon: pungiglioni_regali
unlocks_form: null
ng_plus:
  add_patterns: {p1: [ng_twin_wave], p2: [ng_twin_wave, ng_burrow]}
  idle_mult: 0.85
