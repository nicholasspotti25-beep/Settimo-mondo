  - id: lance_thrust_combo
    anim: thrust
    telegraph: 0.75
    active: 0.95
    recovery: 1.0
    damage_mult: 0.85
    poise: 10
    flags: []
    range: [0, 6.5]
    weight: 1.3
    track: 1.0
    track_active: 0.35
