    anim: charge
    telegraph: 0.7
    active: 1.0
    recovery: 1.2
    damage_mult: 1.0
    poise: 22
    flags: [knockback]
    weight: 0
    track: 2.4
    track_active: 0.1
    motion:
      - {t: 0, dur: 0.95, type: forward, speed: 19}
    hits:
      - {t: 0, dur: 0.95, shape: {type: capsule, a: [0, 1.4, 0.8], b: [0, 1.7, 5.2], r: 1.05}}
