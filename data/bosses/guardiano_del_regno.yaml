  - id: spectral_thrust
    anim: thrust
    telegraph: 0.95
    active: 0.5
    recovery: 1.2
    damage_mult: 1.15
    poise: 18
    flags: []
    range: [3, 18]
    weight: 1.0
    cooldown: 4
    track: 1.0
