  - id: heavy_overhead
    anim: overhead
    telegraph: 1.15
    active: 0.3
    recovery: 1.45
    damage_mult: 1.6
    poise: 30
    flags: [red, knockdown]
    range: [0, 5.5]
    weight: 0.8
    cooldown: 5
    track: 1.1
