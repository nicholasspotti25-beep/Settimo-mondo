  - id: double_charge
    anim: charge
    telegraph: 0.8
    active: 1.0
    recovery: 0.45
    damage_mult: 1.0
    poise: 22
    flags: [knockback]
    range: [5, 40]
    weight: 1.1
    cooldown: 6
    track: 1.3
    track_active: 0.12
    combo_next: charge_return
    combo_chance: 1
