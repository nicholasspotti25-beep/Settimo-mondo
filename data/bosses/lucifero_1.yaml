# 12. Lucifero, l'Arcangelo Caduto (first encounter) — principal · Cattedrale Caduta · scripted: cannot be won · no weapon.
# Burned black wings, cracked golden armor, a throne of swords in the overturned nave. He sits like someone with no more
# hurry. Once the three seals are open he speaks: "Sei vivo, piccolo seme. Cosa vuoi da me?" — Affronta / Implora.
#  - Affronta: a real fight; you can dodge and hit, but he is invulnerable (canDie false). The Metamondo is shattered with one
#    finger. After about two minutes he rises from the throne for the first time: an unavoidable attack (Il Rifiuto) ends the
#    fight as a narrative defeat; you wake by the Scala dei Dannati with full Health and Lacrime and the Cicatrice del Rifiuto.
#  - Implora: hold for five seconds, kneeling under his gaze; he laughs, tired, and lets you go with the Piuma Nera.
# He spares you because he recognized the seed. The model supports both looks (lucifero_1 seated, lucifero_2 standing).
# Local frame: +Z forward, +Y up, +X = Lucifero's LEFT. He never leaves the throne until Il Rifiuto.
