        hits:
          - {t: 0.0, dur: 0.12, shape: {type: capsule, a: [0, 2.0, 0.5], b: [0, 1.6, 4.6], r: 0.45}}
          - {t: 0.3, dur: 0.12, shape: {type: capsule, a: [0, 2.0, 0.5], b: [0, 1.6, 4.6], r: 0.45}}
          - {t: 0.6, dur: 0.12, shape: {type: capsule, a: [0, 2.0, 0.5], b: [0, 1.6, 4.8], r: 0.5}}
