        weight: 0.8
        cooldown: 4
        spawns:
          - {t: 0.0, type: hazard, id: palude_mire_arm, at: target_predict, count: 1, delay: 1.0, active: 0.5, flags: [slow], shape: {type: cylinder, c: [0, 0, 0], r: 1.7, h: 3.4}}
