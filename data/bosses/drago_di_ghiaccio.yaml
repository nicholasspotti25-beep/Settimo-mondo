# 27. Drago di Ghiaccio — mini boss · Altipiano delle Ossa (Cimitero dei Draghi) · D14 · no dialogue, no lore.
# A white-and-azure dragon about 20 m long, ice crystals instead of scales, a breath of frozen fog. It lands among the
# ribs of the dead dragons on the bone plateau.
# Phase 1: the frost breath is a slow cone that leaves icy patches on the ground (behavior: they make the footing slide,
# not damage), claws, a lunging bite, tail sweeps (low: jump or roll them) and the tail spin that sweeps the whole
# circle around it (Colpo Rosso, low), a stomp whose frost ring is born beyond the stomp's own reach (no double blow).
# Phase 2 (storm): it unleashes a blizzard (flag storm, arena_state storm): telegraphed wind gusts push you (cue
# ghiaccio_gust 1.0 s before, pos = wind unit vector), stalactites fall from above on marked spots (the one on you is
# always marked 1.7 s ahead and never falls while the dragon is winding up a blow), the wings raise a gale that pushes
# you away across the ice, and the breath turns into a blizzard that paints a wider trail.
# Behavior: src/content/bosses/drago_di_ghiaccio/behavior.ts.
# Local frame: +Z forward, +Y up, +X = the dragon's LEFT. Quadruped: chest at 2.5 m, head on a low neck at ~7 m forward,
# tail to ~10 m behind (low hurtboxes so the 1.8 m player reaches legs, chest, belly and tail).
id: drago_di_ghiaccio
order: 27
name_key: boss.drago_di_ghiaccio.name
class: mini
difficulty: 14
act: 5
arena: ossa_altipiano
zone: altipiano_ossa
model: {builder: drago_di_ghiaccio, rig: dragon, scale: 1.0, palette: act5_gold_white_midnight}
equilibrio_max: 260
body: {radius: 3.2, height: 7.0, mass: immovable}
hurtboxes:
  - {c: [0, 2.6, 2.4], r: 2.4}        # chest
  - {c: [0, 2.4, -0.6], r: 2.4}       # belly
  - {c: [0, 2.2, -3.4], r: 2.0}       # haunches
  - {c: [1.9, 1.0, 3.0], r: 1.1}      # left foreleg
  - {c: [-1.9, 1.0, 3.0], r: 1.1}     # right foreleg
  - {c: [2.0, 1.0, -2.6], r: 1.1}     # left hind leg
  - {c: [-2.0, 1.0, -2.6], r: 1.1}    # right hind leg
  - {c: [0, 1.4, -6.6], r: 1.4}       # tail base
  - {c: [0, 0.9, -9.6], r: 1.0}       # tail tip
  - {c: [0, 3.9, 5.2], r: 1.3}        # neck
  - {c: [0, 3.6, 7.4], r: 1.2}        # head (low, the frozen fog pours from it)
move: {walk: 3.2, run: 8.0, turn: 1.6, preferred_range: [1.5, 6.5]}
idle_gap: [1.0, 1.5]
music: boss_drago_di_ghiaccio
phases:
  - id: p1
    hp_range: [1.0, 0.5]
    music: boss_drago_di_ghiaccio_p1
    patterns: [claw_swipe, bite, frost_breath, tail_sweep, tail_spin, frost_stomp]
  - id: p2
    hp_range: [0.5, 0.0]
    music: boss_drago_di_ghiaccio_p2
    on_enter: [storm]
    arena_state: storm
    transition: 2.6
    speed_mult: 1.06
    aggression: 1.1
    opener: stalactite_rain
    patterns: [claw_swipe, bite, blizzard_breath, tail_sweep, tail_spin, frost_stomp, stalactite_rain, wing_gale]
attacks:
  # The right foreclaw rakes forward; sometimes the left answers with its own tell (a landed blow ends the chain).
  - id: claw_swipe
    anim: claw_r
    telegraph: 0.7
    active: 0.3
    recovery: 1.0
    damage_mult: 1.0
    poise: 20
    flags: []
    range: [0, 5.5]
    weight: 1.3
    cooldown: 2
    track: 1.2
    track_active: 0.1
    combo_next: claw_swipe_l
    combo_chance: 0.4
    motion:
      - {t: -0.1, dur: 0.25, type: forward, speed: 2.5}
    hits:
      - {t: 0.05, dur: 0.2, shape: {type: arc, r: 8.5, angle: 110, yaw: -10, y: [0, 3.6]}}
    sfx: ghiaccio_claw
  - id: claw_swipe_l
    anim: claw_l
    telegraph: 0.6
    active: 0.3
    recovery: 1.2
    damage_mult: 1.0
    poise: 20
    flags: []
    range: [0, 6]
    weight: 0
    track: 1.2
    track_active: 0.1
    motion:
      - {t: -0.1, dur: 0.25, type: forward, speed: 2.5}
    hits:
      - {t: 0.05, dur: 0.2, shape: {type: arc, r: 8.5, angle: 110, yaw: 10, y: [0, 3.6]}}
    sfx: ghiaccio_claw
  # The neck draws back, the jaws open (crystal teeth glint), then a straight lunge.
  - id: bite
    anim: bite
    telegraph: 0.75
    active: 0.3
    recovery: 1.2
    damage_mult: 1.25
    poise: 24
    flags: []
    range: [1, 8]
    weight: 1.1
    cooldown: 2.5
    track: 1.3
    track_active: 0.1
    motion:
      - {t: -0.05, dur: 0.3, type: forward, speed: 9}
    hits:
      - {t: 0.05, dur: 0.22, shape: {type: capsule, a: [0, 2.0, 5.0], b: [0, 2.6, 10.0], r: 1.6}}
    sfx: ghiaccio_bite
  # Frozen fog: the throat glows azure during a 1.1 s inhale (the head stops turning 0.45 s before: run out of the cone),
  # then a slow cone that follows you a little. Where it
  # passes it leaves icy patches on the ground (ice_trail events: the behavior lays them; they make you slide).
  - id: frost_breath
    anim: breath
    telegraph: 1.1
    active: 1.8
    recovery: 1.5
    damage_mult: 0.35
    poise: 0
    flags: []
    element: ice
    range: [3, 16]
    weight: 1.0
    cooldown: 9
    track: 1.0
    track_active: 0.1
    hits:
      - {t: 0.0, dur: 1.8, tick: 0.45, element: ice, status: {kind: slow, dur: 1.2, power: 0.25}, shape: {type: arc, r: 15, angle: 42, yaw: 0, y: [0, 4.5]}}
    spawns:
      - {t: -1.0, type: vfx, id: ghiaccio_inhale}
      - {t: 0.45, type: custom, event: ice_trail}
      - {t: 1.05, type: custom, event: ice_trail}
      - {t: 1.65, type: custom, event: ice_trail}
    sfx: ghiaccio_breath
  # The tail coils (crystals along it ring), then sweeps the side and the back: low, jump or roll it.
  - id: tail_sweep
    anim: tail_sweep
    telegraph: 0.9
    active: 0.4
    recovery: 1.3
    damage_mult: 1.1
    poise: 26
    flags: [knockback]
    range: [0, 10]
    weight: 1.2
    cooldown: 3
    track: 0.6
    track_active: 0
    hits:
      - {t: 0.05, dur: 0.3, shape: {type: arc, r: 13, angle: 200, yaw: 180, y: [0, 1.4]}}
    sfx: ghiaccio_tail
  # The tail sweeps the whole circle around it: it crouches and the tail lifts high for 1.2 s. Colpo Rosso, low (y ≤ 1.2):
  # jump it or roll through it.
  - id: tail_spin
    anim: tail_spin
    telegraph: 1.2
    active: 0.7
    recovery: 1.6
    damage_mult: 1.2
    poise: 28
    flags: [red, knockdown]
    range: [0, 11]
    weight: 0.7
    cooldown: 12
    track: 0.3
    track_active: 0
    hits:
      - {t: 0.1, dur: 0.5, shape: {type: arc, r: 14.5, angle: 360, yaw: 0, y: [0, 1.2]}}
    sfx: ghiaccio_tail_spin
  # It rears on its hind legs and stamps: the stomp covers the front; the frost ring is born at 9 m (beyond the stomp's
  # reach, never both at one spot) and runs to 15 m, low enough to jump.
  - id: frost_stomp
    anim: stomp
    telegraph: 1.0
    active: 0.25
    recovery: 1.4
    damage_mult: 1.2
    poise: 26
    flags: [knockdown]
    range: [0, 7]
    weight: 0.9
    cooldown: 7
    track: 1.0
    track_active: 0
    hits:
      - {t: 0.0, dur: 0.2, shape: {type: sphere, c: [0, 0.5, 4.0], r: 4.4}}
    spawns:
      - {t: 0.15, type: shockwave, radius: 15, element: ice, shape: {type: ring, r0: 9, r1: 15, width: 1.2, height: 0.7}, active: 0.7, damage_mult: 0.6}
    sfx: ghiaccio_stomp
  # Phase 2: the storm's breath: a wider cone that paints a longer icy trail.
  - id: blizzard_breath
    anim: breath
    telegraph: 1.1
    active: 2.0
    recovery: 1.5
    damage_mult: 0.35
    poise: 0
    flags: []
    element: ice
    range: [3, 16]
    weight: 1.0
    cooldown: 9
    track: 1.0
    track_active: 0.12
    hits:
      - {t: 0.0, dur: 2.0, tick: 0.45, element: ice, status: {kind: slow, dur: 1.2, power: 0.25}, shape: {type: arc, r: 16, angle: 52, yaw: 0, y: [0, 5]}}
    spawns:
      - {t: -1.0, type: vfx, id: ghiaccio_inhale}
      - {t: 0.4, type: custom, event: ice_trail}
      - {t: 0.9, type: custom, event: ice_trail}
      - {t: 1.4, type: custom, event: ice_trail}
      - {t: 1.9, type: custom, event: ice_trail}
    sfx: ghiaccio_breath
  # Phase 2: it roars at the storm and the stalactites hanging in the clouds come down: one marked on you (1.7 s), four
  # elsewhere on the plateau at least 5 m from you (behavior: stalactites event).
  - id: stalactite_rain
    anim: roar_up
    telegraph: 0.9
    active: 0.4
    recovery: 1.3
    damage_mult: 1.3
    poise: 26
    flags: [knockdown]
    element: ice
    global: true
    weight: 0.8
    cooldown: 10
    track: 0.6
    spawns:
      - {t: 0.0, type: custom, event: stalactites}
    sfx: ghiaccio_roar
  # Phase 2: the wings beat (1.0 s, they open wide) and raise a gale that pushes you away for 1.6 s, across the ice.
  # No blow of its own: the danger is where the wind carries you.
  - id: wing_gale
    anim: wing_beat
    telegraph: 1.0
    active: 1.6
    recovery: 1.1
    damage_mult: 0.5
    poise: 0
    flags: []
    range: [0, 14]
    weight: 0.7
    cooldown: 11
    track: 1.0
    spawns:
      - {t: 0.0, type: custom, event: gale}
      - {t: 0.0, type: vfx, id: ghiaccio_gale}
    sfx: ghiaccio_wings
  # New Game+ phase 1: the tail sweep comes back the other way, with its own 0.7 s coil.
  - id: ng_tail_return
    anim: tail_sweep
    telegraph: 0.9
    active: 0.4
    recovery: 0.4
    damage_mult: 1.1
    poise: 26
    flags: [knockback]
    range: [0, 10]
    weight: 0.9
    cooldown: 6
    track: 0.6
    track_active: 0
    combo_next: ng_tail_back
    combo_chance: 1
    hits:
      - {t: 0.05, dur: 0.3, shape: {type: arc, r: 13, angle: 200, yaw: 180, y: [0, 1.4]}}
    sfx: ghiaccio_tail
  - id: ng_tail_back
    anim: tail_sweep_back
    telegraph: 0.7
    active: 0.4
    recovery: 1.4
    damage_mult: 1.1
    poise: 26
    flags: [knockback]
    range: [0, 14]
    weight: 0
    track: 0.6
    track_active: 0
    hits:
      - {t: 0.05, dur: 0.3, shape: {type: arc, r: 13, angle: 200, yaw: 180, y: [0, 1.4]}}
    sfx: ghiaccio_tail
  # New Game+ phase 2: a cage of seven stalactites falls in a ring around you with ONE gap (on the side away from the
  # dragon), and a last one on you: walk out through the gap or roll between them (all marked 1.6 s).
  - id: ng_ice_cage
    anim: roar_up
    telegraph: 0.9
    active: 0.4
    recovery: 1.4
    damage_mult: 1.3
    poise: 26
    flags: [knockdown]
    element: ice
    global: true
    weight: 0.7
    cooldown: 14
    track: 0.6
    spawns:
      - {t: 0.0, type: custom, event: ice_cage}
    sfx: ghiaccio_roar
  # Not selected (weight 0): the stalactite blueprint the behavior drops on chosen points (storm, rain, cage).
  - id: stalactite_drop
    anim: idle
    telegraph: 0.5
    active: 0.2
    recovery: 0.2
    damage_mult: 1.1
    poise: 26
    flags: [knockdown]
    element: ice
    weight: 0
    range: [999, 999]
time_of_day_variants:
  # At night the frozen fog is thicker: it breathes more often (rhythm, not strength).
  notte: {weights: {frost_breath: 1.4, blizzard_breath: 1.4}}
  # At dawn it rests on the bones and lets you come: it opens by sweeping the circle around it.
  alba: {opener: tail_sweep, weights: {tail_spin: 0.7}}
dialogue_keys: []
drops_weapon: naginata_cristallina
unlocks_form: null
metamondo_reaction: null
ng_plus:
  add_patterns: {p1: [ng_tail_return], p2: [ng_tail_return, ng_ice_cage]}
  speed_mult: 1.06
  idle_mult: 0.82
