# 8. Pyro, il Cavaliere di Fiamme — secondary · Landa dei Roghi · D8.
# First of the Tre Cavalieri del Giuramento. A giant knight in dark-red incandescent armor, cloak of flames, wavy
# greatsword (flamberge). Long two-handed combos, fire waves that run along the ground, a leap with slam.
# Phase 2: he wraps himself in flames and attacks at range too (crescents, orbs, fire columns, a nova of waves).
# Local frame: +Z forward, +Y up, +X = Pyro's LEFT. Blade in both hands, swings read right-to-left then left-to-right.
