    range: [0, 6]
    weight: 1.6
    cooldown: 4
    track: 0
    hits:
      - {t: 0.04, dur: 0.2, shape: {type: arc, r: 7.5, angle: 170, yaw: 180, y: [0, 4]}}
    sfx: lupo_tail
  # The howl calls the snowstorm (behavior: wind that drifts you, gusts; STORM_DUR seconds).
  - id: howl
    anim: howl
    telegraph: 1.2
    active: 0.8
    recovery: 0.8
    damage_mult: 0.0
    poise: 0
    flags: []
