  # Out of the snow: the amber eyes glint, then he rushes and bites (only in the storm).
  - id: storm_lunge
    anim: charge
    telegraph: 0.8
    active: 0.55
    recovery: 1.2
    damage_mult: 1.15
    poise: 22
