  - {c: [0, 3.5, 1.7], r: 1.9}      # chest
  - {c: [0, 3.3, -0.8], r: 1.8}     # belly
  - {c: [0, 3.1, -3.1], r: 1.6}     # hips
  - {c: [0, 1.3, 2.2], r: 1.2}      # front legs
  - {c: [0, 1.3, -2.8], r: 1.2}     # hind legs
move: {walk: 4.6, run: 12, turn: 3.0, preferred_range: [3, 9]}
