# 17. Grande Lupo — secondary · Taiga, Radura dei Tre Spiriti · D11.
# A gray-silver wolf as tall as a house, amber eyes, wrapped in a cloud of snow. Very fast: leaps, bites, a howl that calls
# a snowstorm (behavior: STORM_DUR s of wind that drifts the player and frost gusts; he rushes out of the snow, amber eyes
# glint first). Phase 2: he splits into a spirit (minion spirito_lupo) that attacks alongside him — one blow at a time.
# One of the Tre Spiriti della Taiga, guide and keeper: he tests whether you are Chaos; finding out you are not is his answer.
# Local frame: +Z forward, +Y up, +X = the wolf's LEFT. Shoulder ~4.6 m, head ~6 m, body ~9 m long.
id: grande_lupo
order: 17
name_key: boss.grande_lupo.name
title_key: boss.grande_lupo.title
class: secondary
difficulty: 11
act: 3
arena: taiga_radura
zone: taiga
model: {builder: grande_lupo, rig: quadruped, scale: 1.0, palette: act3_white_azure}
equilibrio_max: 200
body: {radius: 2.4, height: 6.0, mass: heavy}
hurtboxes:
