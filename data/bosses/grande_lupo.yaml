    recovery: 0.9
    damage_mult: 1.0
    poise: 18
    flags: []
    range: [0, 5.5]
    weight: 1.3
    cooldown: 1.5
    track: 1.3
    track_active: 0.2
    combo_next: bite_2
    combo_chance: 0.5
    motion:
