    hp_range: [1.0, 0.5]
    music: boss_grande_lupo_p1
    opener: bite
    patterns: [bite, leap_bite, pounce, flank_dash, tail_sweep, howl, storm_gust, storm_lunge]
  - id: p2
    hp_range: [0.5, 0.0]
    music: boss_grande_lupo_p2
