# 20. Grande Aquila Reale — secondary · Il Grande Fiume, on the deck of the Nave dei Cercatori · D12.
# A golden eagle with a wingspan as wide as the ship, eyes like two small suns. On the narrow rocking deck between mast
# and sails (behavior: a slow sideways sway of the deck). Phase 1 cycle (behavior): on the deck for DECK_TIME s (talons,
# beak, wing buffet) → take_off → from the sky a feather volley, then a DIVE on you; out of every dive she glides away low
# and straight (climb_out: the CLEAR WINDOW, flag `gliding`, cue aquila_ballista_window) — the onboard BALLISTA
# (sim.addFightInteractable + onInteract) hits her in flight only then and brings her down onto the deck. After SKY_DIVES
# dives she lands. Phase 2: she grabs the ship and lifts it above the water (arena_state ship_lifted: the deck hangs from
# her talons at the bow, tilted toward the stern and swinging); from the bow she plunges her beak along the deck, shakes
# the ship, beats gales and feather rain; holding the ship she cannot evade the ballista.
# Guardian of the river's skies: she mistakes the ship for an invasion.
# Local frame: +Z forward, +Y up, +X = her LEFT. Body ~4 m long, ~3.4 m tall standing, wingspan ~16 m.
id: grande_aquila_reale
order: 20
name_key: boss.grande_aquila_reale.name
title_key: boss.grande_aquila_reale.title
class: secondary
difficulty: 12
act: 3
arena: fiume_nave_ponte
zone: grande_fiume
model: {builder: grande_aquila_reale, rig: bird, scale: 1.0, palette: act3_white_azure}
equilibrio_max: 180
body: {radius: 2.2, height: 3.4, mass: heavy}
hurtboxes:
  - {c: [0, 2.9, 1.8], r: 0.8}      # head, eyes like two small suns
  - {c: [0, 2.0, 0.2], r: 1.5}      # breast and body
  - {c: [0, 1.6, -2.0], r: 0.9}     # tail
  - {c: [2.8, 2.4, 0], r: 1.1}      # left wing root
  - {c: [-2.8, 2.4, 0], r: 1.1}     # right wing root
  - {c: [0, 0.7, 0.4], r: 0.8}      # talons
move: {walk: 3.0, run: 8.0, turn: 2.4, preferred_range: [3, 9], flying: true, hover_height: 0}
idle_gap: [1.0, 1.5]
music: boss_grande_aquila_reale
intro_sequence: grande_aquila_reale_intro
defeat_sequence: grande_aquila_reale_defeat
lore_key: boss.grande_aquila_reale.lore
phases:
  - id: p1
    hp_range: [1.0, 0.5]
    music: boss_grande_aquila_reale_p1
    patterns: [talon_rake, beak_strike, wing_buffet, take_off, feather_volley, dive, land]
  - id: p2
    hp_range: [0.5, 0.0]
    music: boss_grande_aquila_reale_p2
    on_enter: [lifting]
    arena_state: ship_lifted
    dialogue: boss.grande_aquila_reale.mid
    transition: 3.5
    speed_mult: 1.05
    opener: gale
    patterns: [beak_plunge, ship_shake, gale, feather_rain]
attacks:
  # --- On the deck ---
  # A rake of the talons in front of her.
  - id: talon_rake
    anim: claw
    telegraph: 0.8
    active: 0.3
    recovery: 1.1
    damage_mult: 1.2
    poise: 22
    flags: []
    range: [0, 4.5]
    weight: 1.2
    cooldown: 2
    track: 1.2
    track_active: 0.1
    motion:
      - {t: -0.1, dur: 0.25, type: forward, speed: 4}
    hits:
      - {t: 0.04, dur: 0.2, shape: {type: arc, r: 5.0, angle: 120, yaw: 0, y: [0, 3.5]}}
    sfx: aquila_talons
  # The hooked beak strikes straight ahead.
  - id: beak_strike
    anim: bite
    telegraph: 0.7
    active: 0.25
    recovery: 1.0
    damage_mult: 1.1
    poise: 20
    flags: []
    range: [0, 5.5]
    weight: 1.0
    cooldown: 2
    track: 1.3
    track_active: 0.1
    motion:
      - {t: -0.05, dur: 0.2, type: forward, speed: 6}
    hits:
      - {t: 0.03, dur: 0.18, shape: {type: box, c: [0, 2.0, 3.6], half: [0.9, 1.1, 2.3]}}
    sfx: aquila_beak
  # She opens her wings and beats them once: everything around her is thrown back.
  - id: wing_buffet
    anim: wing_beat
    telegraph: 0.9
    active: 0.35
    recovery: 1.3
    damage_mult: 1.0
    poise: 24
    flags: [knockback]
    range: [0, 5]
    weight: 0.8
    cooldown: 6
    hits:
      - {t: 0.05, dur: 0.22, shape: {type: arc, r: 6.5, angle: 360, yaw: 0, y: [0, 4]}}
    sfx: aquila_wings
  # She takes off: the wind of her wings rolls along the deck (jumpable).
  - id: take_off
    anim: take_off
    telegraph: 0.6
    active: 1.0
    recovery: 0.3
    damage_mult: 0.5
    poise: 12
    flags: []
    global: true
    range: [0, 60]
    weight: 0.01
    cooldown: 0
    motion:
      - {t: 0, dur: 1.0, type: rise, height: 10}
    spawns:
      - {t: 0.0, type: custom, event: sky}
      - {t: 0.05, type: shockwave, radius: 7, shape: {type: ring, r0: 1, r1: 7, width: 1.0, height: 0.6}, active: 0.5, damage_mult: 0.5}
    sfx: aquila_take_off
  # --- From the sky ---
  # A volley of golden feathers, hard as arrowheads.
  - id: feather_volley
    anim: air_volley
    telegraph: 0.8
    active: 0.5
    recovery: 0.8
    damage_mult: 0.9
    poise: 14
    flags: []
    global: true
    range: [0, 60]
    weight: 1.0
    cooldown: 2
    track: 1.4
    spawns:
      - {t: 0.05, type: projectile, id: aquila_piuma, count: 5, spread: 40, speed: 18, from: [0, 0, 2]}
    sfx: aquila_feathers
  # The dive: a scream, the wings fold, she falls on you (cue aquila_dive marks the spot), then glides away (climb_out).
  - id: dive
    anim: dive
    telegraph: 1.2
    active: 0.9
    recovery: 0.9
    damage_mult: 1.5
    poise: 30
    flags: [knockdown]
    global: true
    range: [0, 60]
    weight: 0.01
    cooldown: 0
    track: 1.3
    combo_next: climb_out
    combo_chance: 1
    motion:
      - {t: 0, dur: 0.7, type: dive_to_target}
    hits:
      - {t: 0.62, dur: 0.15, shape: {type: arc, r: 4.5, angle: 130, yaw: 0, y: [0, 4]}}
    spawns:
      - {t: 0.0, type: custom, event: dive}
      - {t: 0.7, type: vfx, vfx: aquila_dive_splinters}
    sfx: aquila_scream
  # Out of the dive she glides away low and straight, climbing slowly: the ballista's clear window.
  - id: climb_out
    anim: glide
    telegraph: 0.35
    active: 3.0
    recovery: 0.2
    damage_mult: 0
    poise: 0
    flags: []
    global: true
    range: [0, 60]
    weight: 0.01
    cooldown: 0
    track: 0.3
    motion:
      - {t: 0, dur: 3.0, type: forward, speed: 5}
      - {t: 0, dur: 3.0, type: rise, height: 6}
    spawns:
      - {t: 0.0, type: custom, event: glide}
    sfx: aquila_glide
  # She comes down onto the deck again.
  - id: land
    anim: land
    telegraph: 0.6
    active: 1.0
    recovery: 0.6
    damage_mult: 0
    poise: 0
    flags: []
    global: true
    range: [0, 60]
    weight: 0.01
    cooldown: 0
    motion:
      - {t: 0, dur: 1.0, type: descend}
    spawns:
      - {t: 0.0, type: custom, event: land}
    sfx: aquila_land
  # --- Phase 2: the ship hangs from her talons ---
  # She drops onto the bow and drives her beak along the deck (a long marked line); her head stays down after it.
  - id: beak_plunge
    anim: beak_plunge
    telegraph: 1.1
    active: 0.4
    recovery: 2.2
    damage_mult: 1.5
    poise: 28
    flags: [knockdown]
    global: true
    range: [0, 60]
    weight: 1.2
    cooldown: 4
    track: 1.2
    hits:
      - {t: 0.05, dur: 0.22, shape: {type: box, c: [0, 1.0, 8.5], half: [1.5, 1.5, 7.5]}}
    sfx: aquila_beak
  # She shakes the ship: the deck tilts hard to one side (pushes you toward a rail) and crates slide onto marked spots.
  - id: ship_shake
    anim: shake
    telegraph: 1.1
    active: 2.0
    recovery: 1.0
    damage_mult: 1.1
    poise: 26
    flags: [knockdown]
    global: true
    range: [0, 60]
    weight: 1.0
    cooldown: 7
    spawns:
      - {t: 0.0, type: custom, event: shake}
      - {t: 0.1, type: hazard, id: aquila_crate, at: around_target, count: 3, dist: 4.5, delay: 1.3, active: 0.35, flags: [knockdown], shape: {type: box, c: [0, 0, 0], half: [1.2, 1.2, 1.2]}}
    sfx: aquila_ship_creak
  # A gale of her wings down the deck toward the stern, with a fan of feathers in it.
  - id: gale
    anim: wing_beat
    telegraph: 0.9
    active: 1.4
    recovery: 1.0
    damage_mult: 0.9
    poise: 14
    flags: []
    global: true
    range: [0, 60]
    weight: 1.0
    cooldown: 6
    track: 1.2
    spawns:
      - {t: 0.0, type: custom, event: gale}
      - {t: 0.3, type: projectile, id: aquila_piuma, count: 7, spread: 60, speed: 17, from: [0, 0, 2]}
    sfx: aquila_wings
  # Feathers rain from above onto five marked spots (one on you).
  - id: feather_rain
    anim: air_volley
    telegraph: 0.7
    active: 1.4
    recovery: 0.9
    damage_mult: 1.0
    poise: 16
    flags: []
    global: true
    range: [0, 60]
    weight: 1.0
    cooldown: 5
    spawns:
      - {t: 0.0, type: hazard, id: aquila_feather_rain, at: random_arena, count: 5, delay: 1.2, active: 0.3, shape: {type: cylinder, c: [0, 0, 0], r: 1.9, h: 5}}
    sfx: aquila_feathers
  # --- New Game+ ---
  # Phase 1: out of the sky, two dives — the second from where the first ended, with its own scream.
  - id: ng_double_dive
    anim: dive
    telegraph: 1.2
    active: 0.9
    recovery: 0.5
    damage_mult: 1.4
    poise: 30
    flags: [knockdown]
    global: true
    range: [0, 60]
    weight: 0.01
    cooldown: 0
    track: 1.3
    combo_next: ng_second_dive
    combo_chance: 1
    motion:
      - {t: 0, dur: 0.7, type: dive_to_target}
    hits:
      - {t: 0.62, dur: 0.15, shape: {type: arc, r: 4.5, angle: 130, yaw: 0, y: [0, 4]}}
    spawns:
      - {t: 0.0, type: custom, event: dive}
    sfx: aquila_scream
  - id: ng_second_dive
    anim: dive
    telegraph: 1.0
    active: 0.9
    recovery: 0.9
    damage_mult: 1.4
    poise: 30
    flags: [knockdown]
    global: true
    range: [0, 60]
    weight: 0.01
    cooldown: 0
    track: 1.3
    combo_next: climb_out
    combo_chance: 1
    motion:
      - {t: -0.8, dur: 0.6, type: rise, height: 5}
      - {t: 0, dur: 0.7, type: dive_to_target}
    hits:
      - {t: 0.62, dur: 0.15, shape: {type: arc, r: 4.5, angle: 130, yaw: 0, y: [0, 4]}}
    spawns:
      - {t: 0.0, type: custom, event: dive}
    sfx: aquila_scream
  # Phase 2: she shakes the ship twice, one side then the other, the crates sliding back across the deck.
  - id: ng_storm_shake
    anim: shake
    telegraph: 1.2
    active: 3.4
    recovery: 1.2
    damage_mult: 1.0
    poise: 26
    flags: [knockdown]
    global: true
    range: [0, 60]
    weight: 0.8
    cooldown: 14
    spawns:
      - {t: 0.0, type: custom, event: shake}
      - {t: 0.1, type: hazard, id: aquila_crate, at: around_target, count: 3, dist: 4.5, delay: 1.3, active: 0.35, flags: [knockdown], shape: {type: box, c: [0, 0, 0], half: [1.2, 1.2, 1.2]}}
      - {t: 1.8, type: custom, event: shake_back}
      - {t: 1.9, type: hazard, id: aquila_crate, at: around_target, count: 3, dist: 4.5, delay: 1.3, active: 0.35, flags: [knockdown], shape: {type: box, c: [0, 0, 0], half: [1.2, 1.2, 1.2]}}
    sfx: aquila_ship_creak
time_of_day_variants:
  alba: {opener: take_off, note_key: boss.grande_aquila_reale.tod.alba}
  notte: {projectile_speed_mult: 0.85, note_key: boss.grande_aquila_reale.tod.notte}
dialogue_keys: [boss.grande_aquila_reale.intro, boss.grande_aquila_reale.mid, boss.grande_aquila_reale.defeat]
drops_weapon: piuma_reale
unlocks_form: null
ng_plus:
  add_patterns: {p1: [ng_double_dive], p2: [ng_storm_shake]}
  idle_mult: 0.85
