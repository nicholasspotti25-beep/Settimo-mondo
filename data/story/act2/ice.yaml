  skippable: true
  steps:
    - {camera: boss_reveal, dur: 1.8}
    - {say: boss.ice.intro, speaker: ice}
    - {say: boss.ice.intro2, speaker: ice}
    - {event: start_fight}
- id: ice_defeat
  skippable: true
