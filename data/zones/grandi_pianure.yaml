# The Great Plains: from the foot of the Vetta (spawn, south) the road crosses a sea of tall gold grass, bends west to
# the ruined watch-hill of the Altare della Vista, then runs north-east past a broken waystation to the Altare delle
# Pianure, the fog gate (z 96) and the round meadow of the Cavaliere Errante (center [0,0,130] r 34), then on to the
# dark forest (exit z 195). East of the road a dry gully is spanned by a ruined stone bridge that leads nowhere.
