biome: dark_forest
palette: act1_green_gold
# The Dark Forest: enormous trunks close over the road from the plains (spawn, south); the light barely filters
# through. West of the road a sunken mossy hollow is crossed by an old seekers' boardwalk; east, a ring of black
# standing stones. A broken dark archway marks the deep wood, then the Altare della Foresta (z 76), the fog gate
# (z 93) and the clearing of the Elder Tree (center [0,0,120] r 27), whose shadow covers everything. Exit north to
# the swamp (z 190).
