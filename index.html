<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1f3d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Settimo Mondo" />
  <meta name="description" content="Settimo Mondo — un action RPG di soli boss, per telefoni e tablet." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <title>Settimo Mondo</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #120d1c; overscroll-behavior: none; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #app { position: fixed; inset: 0; }
    #game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #e8d8b8; font: 22px Georgia, serif; letter-spacing: 6px; background: radial-gradient(circle at 50% 70%, #5a3a5a, #120d1c 70%); }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="boot">SETTIMO MONDO</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
