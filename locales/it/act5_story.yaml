# Atto V — Il Regno dei Draghi: introduzione, didascalie, Voce dell'Alba.
story.atto5.titolo: "Atto V — Il Regno dei Draghi"
story.atto5.intro.01: "Ti volti un'ultima volta. Il giardino senza fine era un'aiuola in un parco qualunque. Il mondo ha di nuovo la sua misura, e tu sei più alto di prima."
story.atto5.intro.02: "Oltre il cancello del parco l'erba finisce. Comincia un altopiano coperto di ossa: costole alte come torri, crani grandi come case. Qui sono venuti a morire i draghi."
story.atto5.intro.03: "All'orizzonte, oltre le nuvole, si alza un albero che nessuno sguardo riesce a misurare. La sua chioma sta sopra il cielo. Yggdrasil."
voce.atto5.intro: "Il quinto mondo era dei Draghi. Ne restano queste ossa, e un albero che tiene insieme ciò che il Caos non ha inghiottito. Sali, Portatore. Lassù qualcuno ti aspetta da prima che tu nascessi."
voce.atto5.ossa_altare: "Queste ossa erano ali. Il Caos ha divorato il loro mondo, non il loro ricordo. Ascolta il vento tra le costole: conosce la strada per l'albero."
voce.atto5.nidi_altare: "Nei nidi di pietra non si schiude più nulla da secoli. Eppure qualcosa li custodisce ancora, con tre bocche e un solo istinto."
voce.atto5.osservatorio_altare: "In cima a quella torre qualcuno ha letto il tuo nome nelle stelle quando ancora non avevi un nome. Ha letto anche la tua fine. Vuole sapere se le stelle avevano ragione."
