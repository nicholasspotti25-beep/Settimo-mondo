story.atto6.intro_01: "Una radice cava scende dalla chioma di Yggdrasil fino all'Inferno. La discesa è un viaggio a ritroso."
story.atto6.intro_02: "Dalle crepe della corteccia rivedi tutto ciò che hai attraversato: i nidi dei draghi, il giardino, la neve, le fiamme, il castello."
story.atto6.intro_03: "Il cielo è meno viola. Quattro sfumature di crepuscolo si sono già sciolte verso l'oro."
story.atto6.lucifero_in_piedi: "Il trono di spade è vuoto. Lucifero ti aspetta in piedi, con le ali aperte fino alle volte."
story.atto6.porta_rovesciata: "Dietro il trono si apre la Porta Rovesciata. Oltre, il cielo è sotto i tuoi piedi."
voce.atto6.radice: "Torna dove ti hanno risparmiato, Portatore. Chi ti ha lasciato andare ora vuole sapere perché."
voce.atto6.radice_altare: "Ogni passo verso il basso è un passo che hai già fatto. Ricordali: ti serviranno."
voce.atto6.cattedrale_altare: "Lui ha detto no, e il cielo lo ha perso. Tu porti un sì. Mostraglielo."
voce.atto6.capovolta_altare: "Nel Rovescio il cielo è sotto i piedi. Non cercare l'alto: cerca il passo."
voce.atto6.deserto_altare: "Questa cenere era un mondo. Qualcosa lo mangia ancora, un boccone alla volta."
voce.atto6.palazzo_altare: "Lei ricorda tutti i mondi caduti. Lui ha scelto di dimenticarli. Tu porti il cuore di lui."
voce.atto7.terrazze_altare: "Questo era il cielo di chi disse no. Ora ti guarda chi soffiò i mondi."
voce.atto7.collasso_altare: "Il Caos si è svegliato. Non sei solo, Portatore: respira con lui."
