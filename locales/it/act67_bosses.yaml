boss.lucifero_2.fought: "Sei tornato a prendere il resto del colpo."
boss.lucifero_2.begged: "Sei tornato in piedi. Mi piace di più."
boss.lucifero_2.no: "Io ho perso il cielo per aver detto no. Dimostrami che il tuo sì valga."
boss.lucifero_2.mid: "Senti il calore? La mia cattedrale brucia da quando sono caduto."
boss.lucifero_2.caduta: "Guarda bene, piccolo seme. È lo stesso colpo. Tu non sei più lo stesso."
boss.lucifero_2.parried: "Ecco. Questo è un sì."
boss.lucifero_2.defeat: "Basta così. Hai detto sì con tutto il corpo."
boss.lucifero_2.piuma: "Tieni ancora la mia piuma. Portala dove io non posso più salire."
boss.lucifero_2.cicatrice: "La cicatrice che ti ho lasciato non brucia più. Lo sento da qui."
boss.lucifero_2.porta: "Il cielo, ora, è sotto di noi."
boss.verme_mangiamondi.segment: "Macina del Verme"
