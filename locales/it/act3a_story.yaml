# Atto III — Il Bianco Silenzio (parte A): introduzione, didascalie, Voce dell'Alba.
story.atto3.titolo: "Atto III — Il Bianco Silenzio"
story.atto3.intro.01: "La Scala dei Dannati sale per mille gradini dentro la roccia. A ogni gradino il calore dell'Inferno resta più indietro."
story.atto3.intro.02: "In cima, il vento. Creste bianche sotto il cielo d'oro e di viola, e un silenzio così grande che si sente battere il seme."
story.atto3.gigante_intro: "Dal cratere si leva una torre di roccia nera. Intorno a lei la neve si scioglie."
story.atto3.cratere_spento: "Sull'orlo del cratere torna a cadere la neve."
voce.atto3.intro: "Questo era il mondo del Gelo, il terzo a cadere. La neve ricorda ancora tutto: cammina piano."
voce.atto3.gigante_caduto: "Il fuoco torna a dormire sotto la neve. Non era tuo nemico: era una promessa che nessuno ha mai sciolto."
voce.atto3.vulcano_altare: "Sei uscito dall'Inferno, ma l'Inferno non è uscito da questa montagna. Lassù qualcuno lo tiene giù con le mani."
voce.atto3.corona_vista_altare: "Guarda le aurore: sono ciò che resta del cielo del Gelo. Laggiù, in una caverna, qualcuno ha dipinto il sole."
voce.atto3.corona_altare: "La bestia della caverna non odia nessuno. Difende l'unica cosa che ha: un ricordo."
voce.atto3.rocca_altare: "Hai visto l'alba dipinta. Era vera, una volta. Adesso sai che cosa cerchi."
voce.atto3.rocca_trono_altare: "Chi siede sul trono di brina mente come respira. Ma anche chi mente, a volte, dice il vero. Ascolta tutto, credi a metà."
story.atto3.yeti_intro: "Le pareti della caverna sono coperte di colori antichi. In fondo, qualcosa di bianco si alza davanti al dipinto."
story.atto3.yeti_dipinto: "La bestia si accascia sotto il dipinto. Sulla roccia, un disco d'oro sorge da un orizzonte bianco."
voce.atto3.yeti_caduto: "Quella è l'ultima alba, l'unico sole che il mondo ricordi. Lui l'ha dipinta per non dimenticarla. Tu la porti dentro: va' a farla sorgere."
