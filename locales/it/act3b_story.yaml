# Atto III — Il Bianco Silenzio (parte B): didascalie e Voce dell'Alba (Taiga, Grande Fiume, porto, mare).
story.atto3.lupo_intro: "La neve della radura si solleva in una nuvola. Dentro, due occhi d'ambra."
story.atto3.lupo_sentiero: "Il lupo si scioglie nella neve. Tra gli abeti si apre un sentiero verso il bosco dei tronchi."
voce.atto3.taiga_altare: "Qui il Gelo diventa foresta. Gli abeti sono vecchi come la neve, e tre spiriti li vegliano: il lupo, l'orso, e chi li ha legati."
voce.atto3.lupo_caduto: "Cercava il Caos nei tuoi occhi e non l'ha trovato: era questa la prova. Il secondo spirito protegge il bosco, e non ti chiederà chi sei, ma che cosa sai difendere."
voce.atto3.taiga_orso_altare: "Senti gli alberi? Scricchiolano anche senza vento. Qualcosa di enorme cammina tra i tronchi, piano, come chi non ha mai avuto fretta."
story.atto3.orso_intro: "Tra i tronchi caduti qualcosa respira. Il muschio si muove: non è muschio, è pelliccia."
story.atto3.orso_tamburi: "L'orso si sdraia tra gli alberi che ha difeso. Oltre il bosco, lontano, battono dei tamburi."
voce.atto3.orso_caduto: "Ti ha chiesto che cosa sai difendere, e hai risposto senza parole: la luce che porti dentro. Il terzo spirito non è una bestia: è chi le ha legate tutte e due."
voce.atto3.taiga_tamburi_altare: "Ascolta: tamburi, lontani. Chi li suona conosce la strada del fiume."
story.atto3.sciamano_intro: "Nel cerchio di pietre i tamburi battono da soli. Al centro, una maschera di cervo si alza lentamente."
story.atto3.sciamano_fiume: "I tamburi tacciono. Oltre gli ultimi abeti scorre un fiume immenso, e sull'acqua aspetta una nave."
voce.atto3.sciamano_caduto: "Ha legato i tre spiriti per custodire la strada, non per chiuderla. Segui il Grande Fiume: la Nave dei Cercatori ti porterà dove l'acqua finisce, e oltre."
voce.atto3.nave_altare: "Questa nave non ha equipaggio: la porta la corrente. Chi la costruì voleva arrivare al mare, e oltre il mare, al giardino."
voce.atto3.porto_altare: "Terra, finalmente. Riposa: qui si cambia nave, e il mare non perdona chi ci arriva stanco."
voce.atto3.mare_altare: "Ecco il mare. Il fiume te l'aveva promesso. Dall'altra parte c'è una terra che nessun Cercatore ha mai raccontato."
