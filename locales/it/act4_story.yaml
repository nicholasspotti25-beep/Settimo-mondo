# Atto IV — Il Giardino del Dio: introduzione, didascalie, Voce dell'Alba.
story.atto4.titolo: "Atto IV — Il Giardino del Dio"
story.atto4.intro.01: "La nave tocca la riva del nuovo continente. Oltre la sabbia, una siepe verde sale fino al cielo e non finisce mai."
story.atto4.intro.02: "Tra le foglie si apre un occhio grande come una luna, lucido come una goccia di rugiada. Lo Sguardo del Giardiniere si posa su di te."
story.atto4.intro.03: "Il mondo cresce intorno a te. Il trifoglio diventa una foresta, il polline una pioggia di luce. Sei piccolo come un seme."
voce.atto4.intro: "Non avere paura di essere piccolo. Anche il seme è piccolo, e porta dentro un albero intero."
story.atto4.mantide_intro: "Tra i trifogli giganti qualcosa ti osserva: una mantide verde giada, alta come una cattedrale, la testa inclinata."
story.atto4.primo_cancello: "Il primo cancello del giardino si apre tra le foglie."
voce.atto4.mantide_caduta: "Ti ha studiato fino all'ultimo. Adesso sa che certe creature non si lasciano potare."
voce.atto4.trifoglio_altare: "Qui tutto è grande, tranne te. Ma la grandezza non è forza: ricordatelo, piccolo seme."
voce.atto4.muschio_altare: "Un giardiniere che ha paura di perdere costruisce cancelli. Ne hai aperto uno. Ne restano due."
story.atto4.coleottero_intro: "Nel bosco di muschio un'armatura azzurra si muove: un coleottero enorme, le mandibole come due corna di cervo."
story.atto4.secondo_cancello: "Il secondo cancello si apre. Il generale resta immobile, le mandibole abbassate in un saluto."
voce.atto4.coleottero_caduto: "Ti ha salutato come un pari. Nel giardino di un dio anche il più piccolo può essere degno."
voce.atto4.radici_altare: "Sotto le radici si scava da secoli. Le formiche conoscono la strada per la serra: seguila, senza farti travolgere."
story.atto4.regina_intro: "Sotto le radici la terra brulica. Tra uova che brillano come lanterne si solleva la Regina, il ventre d'oro gonfio di vita."
story.atto4.terzo_cancello: "Il formicaio si apre. Oltre le uova spente, un passaggio sotterraneo scende verso la serra."
voce.atto4.regina_caduta: "Le operaie si fermano. Senza la loro regina non sanno più dove andare. Tu sì: la serra ti aspetta."
voce.atto4.serra_altare: "Sotto il vetro tutto è perfetto, e niente respira. Il dio di questo giardino ha perso qualcosa, un tempo. Ora non vuole perdere più nulla."
