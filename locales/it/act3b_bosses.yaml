# Atto III — Il Bianco Silenzio (parte B): boss, parti, varianti dell'ora del giorno.
boss.grande_lupo.title: "Il Primo dei Tre Spiriti"
boss.grande_lupo.lore: "Uno dei Tre Spiriti della Taiga, guida e custode della foresta. Mette alla prova chi la attraversa per scoprire se è il Caos: scoprire che non lo sei è la sua risposta."
boss.grande_lupo.spirit: "Spirito del Lupo"
boss.grande_lupo.tod.alba: "All'alba ti gira intorno e ti studia, prima di mordere."
boss.grande_lupo.tod.notte: "Di notte la tormenta arriva con il primo ululato."
boss.grande_lupo.intro: "Ti ho fiutato da tre valli lontano. Odori di seme... ma anche il Caos sa travestirsi. Fatti guardare."
boss.grande_lupo.mid: "Siamo in due, adesso. Il Caos divora senza guardare: tu guardi ancora?"
boss.grande_lupo.defeat: "Non sei il Caos. Il Caos non si sarebbe fermato. Va', piccolo seme: il fratello del bosco ti aspetta."
boss.grande_orso.title: "Il Secondo dei Tre Spiriti"
boss.grande_orso.lore: "Secondo spirito della Taiga, protettore del bosco. Ha difeso gli alberi più vecchi per secoli. Combatte per sapere se sai proteggere qualcosa."
boss.grande_orso.tod.alba: "All'alba non si allontana dagli alberi più vecchi: carica di rado, ma ti stringe più spesso."
boss.grande_orso.tod.notte: "Di notte esce dal buio dei tronchi a testa bassa."
boss.grande_orso.intro: "Il lupo ti ha lasciato passare. Io non ti chiedo che cosa sei. Ti chiedo che cosa sai proteggere."
boss.grande_orso.mid: "Senti il bosco? Trema con me. Adesso proteggi almeno te stesso."
boss.grande_orso.defeat: "Hai protetto la piccola luce che porti, fino all'ultimo. Basta così. Ai tamburi ti aspetta chi ci ha legati."
