# Atto IV — Il Giardino del Dio: boss, titoli, battute, lore, varianti del giorno.
boss.re_mantide.title: "Capo delle Guardie del Giardino"
boss.re_mantide.lore: "Capo delle guardie del giardino di Uruk. Studiava ogni intruso come un naturalista studia un insetto raro, e solo dopo lo potava. Custodiva il primo cancello verso la serra."
boss.re_mantide.intro: "Fermo. Lasciami guardare. Due braccia, niente ali, e gli occhi di chi non si arrende. Che specie curiosa."
boss.re_mantide.mid: "La corona fiorisce solo per chi merita di essere studiato da vicino."
boss.re_mantide.defeat: "Annoterò tutto: una specie che non si lascia potare. Il primo cancello è tuo."
boss.re_mantide.tod.alba: "All'alba è curioso: ti gira intorno e ti osserva prima di colpire."
boss.re_mantide.tod.notte: "Di notte le foglie sono scure: si mimetizza più spesso e riappare alle tue spalle."
boss.coleottero_imperiale.title: "Generale della Corte di Uruk"
boss.coleottero_imperiale.lore: "Generale della corte di Uruk, corazzato d'azzurro metallico. Combatteva a testa bassa e rispettava solo chi resisteva alle sue mandibole. Ha aperto il secondo cancello a un avversario degno."
boss.coleottero_imperiale.intro: "Il Re Mantide ti ha lasciato passare. Io no. Sono il generale di questa corte: mostrami se meriti il secondo cancello."
boss.coleottero_imperiale.mid: "Resisti ancora. Allora sei degno delle mie ali."
boss.coleottero_imperiale.defeat: "Un avversario degno. Ti saluto, piccolo guerriero: il secondo cancello è aperto."
boss.coleottero_imperiale.tod.alba: "All'alba ti saluta prima di combattere, e afferra meno."
boss.coleottero_imperiale.tod.notte: "Di notte il suo guscio non riflette la luce: carica dal buio più spesso."
boss.regina_formica.title: "Custode dell'Ultimo Cancello"
boss.regina_formica.lore: "Regina del formicaio sotto le radici, il ventre d'oro gonfio, circondata da uova luminose. Non combatteva da vicino: mandava le sue operaie. Dietro il formicaio comincia il passaggio sotterraneo che porta alla serra di Uruk."
boss.regina_formica.tod.alba: "All'alba si occupa delle uova: manda meno operaie e le uova pulsano più spesso."
boss.regina_formica.tod.notte: "Di notte le uova illuminano il formicaio: le operaie marciano più spesso."
