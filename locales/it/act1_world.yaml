# Atto I — Il Risveglio: Reperti dei Cercatori nel mondo (Castello della Culla, Vetta dell'Attesa).
reperto.rep_culla_lettera.title: "Lettera lasciata sul giaciglio"
reperto.rep_culla_lettera.text: "A chi si sveglierà qui. Non so il tuo nome, e forse non lo sai nemmeno tu. Abbiamo vegliato su questa stanza finché le lanterne hanno avuto olio, poi siamo scesi a cercare l'alba al posto tuo. Se leggi, vuol dire che non l'abbiamo trovata. Perdonaci, e non avere paura del buio delle sale: il crepuscolo qui è solo stanco, non crudele."
reperto.rep_culla_affresco.title: "Affresco dei Sette Mondi"
reperto.rep_culla_affresco.text: "Sette cerchi dipinti uno dentro l'altro, sbiaditi dal tempo. Sei sono colorati: prati, foreste, acque, fuoco, ghiaccio, cielo. Il settimo, al centro, è stato lasciato bianco, come se il pittore aspettasse qualcuno per finirlo. Sotto, una mano diversa ha graffiato nella pietra: «Lo porta chi non ha ombra»."
reperto.rep_culla_reliquia.title: "Corona di ferro spezzata"
reperto.rep_culla_reliquia.text: "Un cerchio di ferro annerito, aperto in un punto come se qualcuno l'avesse forzato con le mani. Sulla balaustra accanto, decine di nomi incisi e cancellati. Chi custodiva il castello si toglieva la corona qui, guardando il mondo sotto le nuvole, e giurava di non scendere finché l'Alba non fosse stata pronta."
reperto.rep_vetta_lanterna.title: "Lanterna di un Cercatore"
reperto.rep_vetta_lanterna.text: "Una lanterna spenta appoggiata contro la roccia, il vetro intatto, lo stoppino consumato fino alla fine. Accanto, un mucchietto di sassi ordinati, uno per ogni giorno di attesa. Sono troppi da contare. Chi l'ha lasciata non è sceso, e non è tornato indietro: ha soltanto aspettato, finché la luce è bastata."
reperto.rep_vetta_lettera.title: "Lettera fermata da un sasso"
reperto.rep_vetta_lettera.text: "Fratello, da quassù si vede tutto: le pianure d'oro, la foresta nera, la palude, il fiume che non riflette niente, e laggiù, in fondo, quel bagliore rosso che nessuno nomina. Il Guardiano non mi lascia passare. Dice che nessuno scende finché l'Alba non è pronta. Io gli ho risposto che l'Alba siamo noi. Lui non ha riso. Domani riprovo."
reperto.rep_vetta_armatura.title: "Armatura davanti alla nebbia"
reperto.rep_vetta_armatura.text: "Un'armatura seduta con la schiena alla nebbia del piazzale, la spada piantata nella neve come una croce. L'elmo guarda verso il castello, non verso la discesa. Forse alla fine aveva capito che la strada non si apriva con il ferro. Forse voleva solo vedere un'ultima volta da dove era venuto."
