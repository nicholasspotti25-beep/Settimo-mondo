# Atto I — Cavaliere Errante, Elder Tree, Mostro della Palude, Great Devourer (mini: nessun testo), Caronte.
# Dialoghi, lore (Specchio dei Ricordi), note per momento del giorno, parti, figure, sussurri delle mille voci, didascalie
# delle sequenze e righe della Voce dell'Alba agli altari dell'Atto I.

# --- Cavaliere Errante
boss.cavaliere_errante.intro: "Un altro che cerca l'alba? Ne ho incontrati tanti, su queste pianure. Nessuno l'ha trovata."
boss.cavaliere_errante.intro2: "Ho cavalcato tutta la vita verso l'orizzonte. Mostrami se la tua strada è più lunga della mia."
boss.cavaliere_errante.mid: "Il mio cavallo ha corso abbastanza. Ora a piedi, come all'inizio."
boss.cavaliere_errante.salute: "In guardia, viandante. Che sia un duello leale."
boss.cavaliere_errante.salute2: "A piedi, e a viso aperto. Come si conviene."
boss.cavaliere_errante.defeat: "Ecco... ora capisco. L'alba non si trova. Si porta."
boss.cavaliere_errante.defeat2: "Prendi la mia lanterna. Io non ho mai saputo accenderla... tu sì."
boss.cavaliere_errante.lore: "Il primo dei Cercatori: cavalcò tutta la vita inseguendo un'alba che non sorgeva mai, con una lanterna spenta appesa alla sella. Cadendo capì che l'alba non si trova: si porta."
boss.cavaliere_errante.tod.alba: "All'alba saluta con la spada e duella lealmente, a viso aperto."
boss.cavaliere_errante.tod.notte: "Di notte scompare nel buio dell'erba alta e carica da dove non guardi."
part.cavaliere_errante.steed: "Destriero grigio"
part.cavaliere_errante.rider: "Cavaliere"
story.atto1.lanterna: "Hai ricevuto la Lanterna del Cavaliere. D'ora in poi brillerà accesa a ogni altare."

# --- Elder Tree
boss.elder_tree.intro: "Piccola cosa senza ombra... la mia ombra è la foresta intera. Restaci dentro."
boss.elder_tree.defeat: "La luce... me n'ero dimenticato... è calda."
boss.elder_tree.lore: "Un seme di Yggdrasil cresciuto senza sole, piegato verso una luce che non arrivava. La sua ombra coprì la foresta per secoli; morendo, lasciò passare il primo raggio di luce che il mondo vedesse da allora."
part.elder_tree.heart: "Cuore luminoso"
story.atto1.primo_raggio: "Per la prima volta da secoli, un raggio di luce tocca il suolo della foresta."

# --- Mostro della Palude
boss.mostro_della_palude.intro: "...un altro... un altro che cerca... vieni giù con noi... quaggiù c'è posto..."
boss.mostro_della_palude.defeat: "...lasciaci affondare... lasciaci dormire... finalmente..."
boss.mostro_della_palude.lore: "Il cumulo dei Cercatori annegati nella palude, fusi insieme dal fango: mostra che cosa accade a chi fallisce. Tra le mille voci, una ripete che il traghettatore non vuole monete."
minion.mostro_della_palude.annegato_lanterna: "Annegato delle Lanterne"
minion.mostro_della_palude.annegato_canne: "Annegato delle Canne"
minion.mostro_della_palude.annegato_ossa: "Annegato delle Ossa"
# Le mille voci annunciano ogni attacco prima che arrivi (una famiglia per tipo di attacco).
boss.mostro_della_palude.voices.rise.1: "...sale... sale dall'acqua..."
boss.mostro_della_palude.voices.rise.2: "...torniamo a galla... guardaci..."
boss.mostro_della_palude.voices.slam.1: "...giù le mani... schiacciala..."
boss.mostro_della_palude.voices.slam.2: "...tutte e due... sulla tua testa..."
boss.mostro_della_palude.voices.slam.3: "...colpisci la terra... come l'acqua colpì noi..."
boss.mostro_della_palude.voices.wave.1: "...il fango corre... non farti prendere..."
boss.mostro_della_palude.voices.wave.2: "...un'onda... lenta... pesante..."
boss.mostro_della_palude.voices.wave.3: "...affonda le gambe... come le nostre..."
boss.mostro_della_palude.voices.arms.1: "...le braccia sotto di te... sotto..."
boss.mostro_della_palude.voices.arms.2: "...ti afferriamo dal fondo..."
boss.mostro_della_palude.voices.arms.3: "...mani nella melma... tante mani..."
boss.mostro_della_palude.voices.reach.1: "...lontano... il braccio arriva lontano..."
boss.mostro_della_palude.voices.reach.2: "...non sei abbastanza lontano..."
boss.mostro_della_palude.voices.sweep.1: "...di lato... spazza... spazza via..."
boss.mostro_della_palude.voices.sweep.2: "...un giro largo... largo..."
boss.mostro_della_palude.voices.sweep.3: "...le lanterne girano... intorno, intorno..."
boss.mostro_della_palude.voices.below.1: "...giù nell'acqua... e poi sotto di te..."
boss.mostro_della_palude.voices.below.2: "...guarda le bolle... guarda le bolle..."
boss.mostro_della_palude.voices.throw.1: "...lanciala... lanciala lontano..."
boss.mostro_della_palude.voices.throw.2: "...da lontano... ti raggiungiamo da lontano..."
boss.mostro_della_palude.voices.thrust.1: "...punte di canna... una, due, tre..."
boss.mostro_della_palude.voices.thrust.2: "...trafiggi... trafiggi..."
boss.mostro_della_palude.voices.lunge.1: "...corrigli contro... corri..."
boss.mostro_della_palude.voices.lunge.2: "...un balzo... adesso..."
boss.mostro_della_palude.voices.clue: "...il traghettatore... non vuole monete... non vuole monete..."

# --- Caronte
boss.caronte.intro: "Non porto i vivi. E non voglio monete: chi sale sulla mia barca mi lascia un ricordo."
boss.caronte.intro2: "Ma tu... Non hai ombra, Portatore. Né passato. Che cosa potresti darmi?"
boss.caronte.mid: "La barca non ti regge. Allora sarà il fiume a giudicarti."
boss.caronte.defeat: "Nessun ricordo... eppure qualcosa in te pesa più di un'anima."
boss.caronte.defeat2: "Sali. Ti porterò alla Porta di Dite. Ciò che porti nel petto sarà il tuo pedaggio."
boss.caronte.lore: "Il traghettatore del Fiume delle Anime. Non vuole monete ma ricordi, e custodisce nella lanterna gli occhi delle anime. Al Portatore, che non ne aveva, concesse il passaggio lo stesso."
boss.caronte.tod.giorno: "Di giorno libera poche anime, ma velocissime."
boss.caronte.tod.notte: "Di notte la lanterna si svuota: molte anime, lente, riempiono il buio."
part.caronte.lantern: "Lanterna degli occhi"
story.atto1.traghetto: "Caronte ti traghetta in silenzio verso la Porta di Dite."

# --- Voce dell'Alba (altari dell'Atto I e righe dopo i boss)
voce.atto1.pianure_vista: "Guarda quanto è grande. Tutto ciò che vedi aspetta un mattino che non arriva."
voce.atto1.pianure: "Su queste pianure molti hanno cercato l'alba. Li chiamavano Cercatori. Nessuno di loro portava un seme."
voce.atto1.cavaliere_lanterna: "La sua lanterna ora è accesa. Non l'hai accesa tu: l'ho accesa io, attraverso di te."
voce.atto1.foresta: "Qui gli alberi crescono storti, verso una luce che non c'è. Anche loro ricordano il sole meglio di te."
voce.atto1.primo_raggio: "Lo hai visto? Il primo raggio da secoli. È piccolo. Ma è un inizio."
voce.atto1.palude: "Ogni lanterna spenta in questa palude era una speranza. Non diventare una di loro."
voce.atto1.annegati: "Ora dormono. Hai ascoltato le loro voci: ricordale. Il traghettatore non vuole monete."
voce.atto1.molo: "Senti l'acqua che scorre oltre la nebbia? È il Fiume delle Anime. Là finisce il mondo dei vivi."
voce.atto1.fiume: "Il traghettatore chiederà un prezzo. Non hai monete, né ricordi. Hai soltanto me."
voce.atto1.senza_ricordi: "Non hai passato, è vero. Ma ogni passo che fai diventa un ricordo. Il Settimo Mondo nascerà da questi."
