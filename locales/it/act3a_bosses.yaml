# Atto III — Il Bianco Silenzio (parte A): boss, parti, varianti dell'ora del giorno.
boss.gigante_di_fuoco.title: "Sentinella tra Inferno e Gelo"
boss.gigante_di_fuoco.lore: "Lo misero sulla Bocca del Vulcano perché il fuoco dell'Inferno non salisse a sciogliere le montagne. Non era malvagio: obbediva. Sotto i suoi piedi la neve si scioglieva e gelava di nuovo, per secoli, come un respiro."
boss.gigante_di_fuoco.tod.alba: "All'alba il ghiaccio sull'orlo è più sottile: il bordo cede più spesso."
boss.gigante_di_fuoco.tod.notte: "Di notte la sua barba illumina il cratere: apre con il respiro di brace."
boss.gigante_di_fuoco.intro: "Il fuoco non sale oltre me. Torna giù, piccolo, o resta qui per sempre."
boss.gigante_di_fuoco.mid: "Mi è stato ordinato di non cedere. Allora brucerò tutto, anche me."
boss.gigante_di_fuoco.defeat: "Ho obbedito... Chi terrà giù il fuoco, adesso?"
part.gigante_di_fuoco.head: "Testa dalla barba di fiamme"
boss.yeti.lore: "Sulla parete della sua caverna dipinse l'ultima alba, l'unico sole che il mondo ricordi. Non voleva combattere: difendeva quel dipinto."
boss.yeti.tod.alba: "All'alba la luce entra nella caverna e cade sul dipinto: la bestia lo guarda, prima di guardare te."
boss.yeti.tod.notte: "Di notte la tormenta è già alzata: apre nascondendosi nella neve."
boss.guardiano_rocca_di_brina.title: "Il Portiere della Rocca"
boss.guardiano_rocca_di_brina.lore: "Portiere di Loki, legato da un giuramento che non ricorda più. Dentro l'armatura di ghiaccio non c'è nessuno: è rimasta soltanto la promessa, e per secoli ha fatto la guardia da sola."
boss.guardiano_rocca_di_brina.tod.alba: "All'alba resta chiuso dietro lo scudo e spinge più spesso."
boss.guardiano_rocca_di_brina.tod.notte: "Di notte la brina brilla sul selciato: apre spingendo il gelo verso di te."
boss.guardiano_rocca_di_brina.intro: "Nessuno entra nella Rocca. L'ho giurato... a chi, non lo ricordo. Ma l'ho giurato."
boss.guardiano_rocca_di_brina.mid: "Lo scudo si spezza. Il giuramento no."
boss.guardiano_rocca_di_brina.defeat: "Finalmente."
boss.loki.title: "L'Ingannatore della Rocca di Brina"
boss.loki.lore: "Il Trickster della Rocca di Brina. Mescola verità e menzogne: ti dice che il Settimo Mondo è una prigione e che Ouranthos è morto. Su una cosa aveva torto, sull'altra ragione."
boss.loki.tod.alba: "All'alba si inchina prima del duello, come a teatro."
boss.loki.tod.notte: "Di notte le sue copie sono tre. L'ombra resta una sola."
boss.loki.intro: "Il Portatore senza ombra! Ti aspettavo, sai. Io aspetto tutti: prima o poi ognuno passa davanti a uno specchio."
boss.loki.intro2: "Ti dirò una cosa vera e una falsa. Indovina quale delle due ti lascerà dormire."
boss.loki.intro3: "E guarda bene: in questa sala c'è una sola ombra. È la mia."
boss.loki.mid: "Lo sai che cos'è il Settimo Mondo? Una prigione. E la cella sei tu."
boss.loki.mid2: "Ouranthos è morto, piccolo seme. Nessuno verrà a raccoglierti."
boss.loki.defeat: "Bravo. Una delle due era vera, sai? Tienila stretta... se capisci quale."
