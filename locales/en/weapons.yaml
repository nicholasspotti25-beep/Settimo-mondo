weapon.lama_della_culla.desc: "Short sword. Quick and light, short reach. Three cuts in sequence."
weapon.lama_della_culla.flavor: "A plain blade found in the empty castle. Someone left it beside your cradle, the way one leaves a lantern for those who must leave."
weapon.lancia_del_custode.desc: "Cavalry lance. Long-reach thrusts to keep your distance; the running attack is a charge."
weapon.lancia_del_custode.flavor: "White shaft, leaf-shaped head engraved with a crown. The Warden lowered it only before one who carried the Dawn."
art.primo_passo.name: "First Step"
art.primo_passo.desc: "A forward lunge, quick as the first step out of the cradle."
art.ninnananna_dell_alba.name: "Dawn Lullaby"
art.ninnananna_dell_alba.desc: "Two crossed cuts that leave a pale cross of light."
art.carica_del_custode.name: "Warden's Charge"
art.carica_del_custode.desc: "A forward dash with a long-reach thrust."
art.ruota_d_argento.name: "Silver Wheel"
art.ruota_d_argento.desc: "A 360-degree spin that pushes back nearby enemies."
