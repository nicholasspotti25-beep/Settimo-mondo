# Act I — The Awakening: Reperti dei Cercatori in the world (Castello della Culla, Vetta dell'Attesa).
reperto.rep_culla_lettera.title: "Letter left on the bed"
reperto.rep_culla_lettera.text: "To whoever wakes here. I do not know your name, and perhaps neither do you. We watched over this room for as long as the lanterns had oil, then we went down to look for the dawn in your place. If you are reading this, we did not find it. Forgive us, and do not fear the dark of the halls: the twilight here is only tired, not cruel."
reperto.rep_culla_affresco.title: "Fresco of the Seven Worlds"
reperto.rep_culla_affresco.text: "Seven circles painted one inside the other, faded by time. Six are coloured: meadows, forests, waters, fire, ice, sky. The seventh, at the centre, was left white, as if the painter were waiting for someone to finish it. Beneath it, another hand scratched into the stone: \"It is carried by the one who has no shadow.\""
reperto.rep_culla_reliquia.title: "Broken iron crown"
reperto.rep_culla_reliquia.text: "A ring of blackened iron, split open at one point as if someone had forced it with bare hands. On the balustrade beside it, dozens of names carved and scratched out. Those who kept the castle took off their crown here, looking at the world beneath the clouds, and swore not to descend until the Dawn was ready."
reperto.rep_vetta_lanterna.title: "A Seeker's lantern"
reperto.rep_vetta_lanterna.text: "An unlit lantern leaning against the rock, its glass unbroken, the wick burned down to nothing. Beside it, a small pile of neatly stacked stones, one for each day of waiting. There are too many to count. Whoever left it did not descend, and did not turn back: they only waited, for as long as the light lasted."
reperto.rep_vetta_lettera.title: "Letter held down by a stone"
reperto.rep_vetta_lettera.text: "Brother, from up here you can see everything: the golden plains, the black forest, the swamp, the river that reflects nothing, and far away, at the very end, that red glow nobody names. The Guardian will not let me pass. He says nobody descends until the Dawn is ready. I told him that we are the Dawn. He did not laugh. Tomorrow I will try again."
reperto.rep_vetta_armatura.title: "Armour before the mist"
reperto.rep_vetta_armatura.text: "A suit of armour sitting with its back to the mist of the plaza, its sword planted in the snow like a cross. The helm looks toward the castle, not toward the descent. Perhaps in the end he understood that the road would not open to iron. Perhaps he only wanted to see, one last time, where he had come from."

# Act I: Great Plains, Dark Forest.
reperto.rep_pianure_diario.title: "Page from a travel diary"
reperto.rep_pianure_diario.text: "Third day in the tall grass. The wind bends all of it the same way, as if it pointed at a road, but every morning it points somewhere else. From the ruins you can still see the Summit, small and white. Tonight a knight galloped past without seeing me: an unlit lantern hung from his saddle. I shouted to ask whether he knew where the dawn was. He did not stop."
reperto.rep_pianure_sella.title: "Saddle left in the grass"
reperto.rep_pianure_sella.text: "A gray saddle worn down to the wood, and beside it an empty suit of armor sitting like someone waiting for a friend. On the leather someone carved with a knife point dozens of roads that cross each other and none that arrives. At the bottom, in larger letters: \"One more.\""
reperto.rep_pianure_ponte.title: "Lantern on the broken bridge"
reperto.rep_pianure_ponte.text: "The bridge ends in the void, halfway across the gully. Someone left a lantern burning on the last stone, facing the bank that is no longer there, so that whoever came back would know where to stop. The oil ran out long ago. The glass is still clean: someone kept on cleaning it."
reperto.rep_foresta_corteccia.title: "Names in the bark"
reperto.rep_foresta_corteccia.text: "On the trunk, at the height of the heart, hundreds of names carved one over another. The lowest have been swallowed by the bark, as if the tree had eaten them. The last is fresh, but the hand stopped halfway: two letters, then a long scratch downward."
reperto.rep_foresta_lanterne.title: "Lanterns along the boardwalk"
reperto.rep_foresta_lanterne.text: "The Seekers hung a lantern every thirty paces, so that whoever came after would not get lost. Here under the trees the night never ends, and the oil ran out before the road did. The last lantern still hangs, and below it, in the moss, a staff planted upright: whoever carried it went on in the dark."
reperto.rep_foresta_seme.title: "Letter from a botanist"
reperto.rep_foresta_seme.text: "I found the seed it grew from. It does not come from this world: it comes from the tree that holds up all the worlds, the one above the clouds. It grew without ever seeing the sun, and it learned to make shade instead of light. It is not wicked. It is only afraid of the day, as we are afraid of the night. If someone fells it, I hope they do it gently."
