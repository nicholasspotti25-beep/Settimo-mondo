# Act IV — The God's Garden: intro, captions, Voice of Dawn.
story.atto4.titolo: "Act IV — The God's Garden"
story.atto4.intro.01: "The ship touches the shore of the new continent. Beyond the sand, a green hedge climbs to the sky and never ends."
story.atto4.intro.02: "Among the leaves an eye opens, as large as a moon, bright as a drop of dew. The Gardener's Gaze settles on you."
story.atto4.intro.03: "The world grows around you. The clover becomes a forest, the pollen a rain of light. You are as small as a seed."
voce.atto4.intro: "Do not be afraid of being small. The seed is small too, and it carries a whole tree inside."
story.atto4.mantide_intro: "Among the giant clovers something is watching you: a jade-green mantis as tall as a cathedral, its head tilted."
story.atto4.primo_cancello: "The first gate of the garden opens among the leaves."
voce.atto4.mantide_caduta: "He studied you to the very end. Now he knows that some creatures will not be pruned."
voce.atto4.trifoglio_altare: "Everything here is large, except you. But size is not strength: remember it, little seed."
voce.atto4.muschio_altare: "A gardener afraid of losing builds gates. You have opened one. Two remain."
story.atto4.coleottero_intro: "In the moss forest a blue armor moves: an enormous beetle, its mandibles like two stag's antlers."
story.atto4.secondo_cancello: "The second gate opens. The general stands still, his mandibles lowered in a salute."
voce.atto4.coleottero_caduto: "He saluted you as an equal. In a god's garden even the smallest can be worthy."
voce.atto4.radici_altare: "Under the roots the ants have been digging for centuries. They know the way to the greenhouse: follow it, and do not be swept away."
story.atto4.regina_intro: "Under the roots the earth is teeming. Among eggs that shine like lanterns the Queen rises, her golden abdomen swollen with life."
story.atto4.terzo_cancello: "The anthill opens. Beyond the darkened eggs, an underground passage leads down toward the greenhouse."
voce.atto4.regina_caduta: "The workers stop. Without their queen they no longer know where to go. You do: the greenhouse is waiting."
voce.atto4.serra_altare: "Under the glass everything is perfect, and nothing breathes. The god of this garden lost something, once. Now he wants to lose nothing more."
