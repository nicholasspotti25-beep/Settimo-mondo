# Act III — The White Silence (part A): bosses, parts, time-of-day variants.
boss.gigante_di_fuoco.title: "Sentinel between Inferno and Frost"
boss.gigante_di_fuoco.lore: "He was set upon the Mouth of the Volcano so that the fire of the Inferno would never rise to melt the mountains. He was not evil: he obeyed. Under his feet the snow melted and froze again, for centuries, like a breath."
boss.gigante_di_fuoco.tod.alba: "At dawn the glaze on the rim is thinner: the edge gives way more often."
boss.gigante_di_fuoco.tod.notte: "At night his beard lights up the crater: he opens with his ember breath."
boss.gigante_di_fuoco.intro: "No fire rises past me. Go back down, little one, or stay here forever."
boss.gigante_di_fuoco.mid: "I was ordered not to yield. Then I will burn everything, even myself."
boss.gigante_di_fuoco.defeat: "I obeyed... Who will hold the fire down now?"
part.gigante_di_fuoco.head: "Head with the beard of flames"
boss.yeti.lore: "On the wall of his cave he painted the last dawn, the only sun the world remembers. He did not want to fight: he was defending that painting."
boss.yeti.tod.alba: "At dawn the light enters the cave and falls on the painting: the beast looks at it before it looks at you."
boss.yeti.tod.notte: "At night the blizzard is already up: he opens by hiding in the snow."
boss.guardiano_rocca_di_brina.title: "The Porter of the Rocca"
boss.guardiano_rocca_di_brina.lore: "Loki's porter, bound by an oath he no longer remembers. There is no one inside the armor of ice: only the promise remained, and for centuries it kept watch alone."
boss.guardiano_rocca_di_brina.tod.alba: "At dawn he stays closed behind his shield and pushes more often."
boss.guardiano_rocca_di_brina.tod.notte: "At night the rime glitters on the flagstones: he opens by sending the frost toward you."
boss.guardiano_rocca_di_brina.intro: "No one enters the Rocca. I swore it... to whom, I do not remember. But I swore it."
boss.guardiano_rocca_di_brina.mid: "The shield breaks. The oath does not."
boss.guardiano_rocca_di_brina.defeat: "At last."
boss.loki.title: "The Trickster of the Rocca di Brina"
boss.loki.lore: "The Trickster of the Rocca di Brina. He mixes truth and lies: he tells you the Seventh World is a prison and that Ouranthos is dead. He was wrong about one thing and right about the other."
boss.loki.tod.alba: "At dawn he bows before the duel, as if on a stage."
boss.loki.tod.notte: "At night his copies are three. The shadow is still only one."
boss.loki.intro: "The Bearer without a shadow! I was expecting you, you know. I expect everyone: sooner or later, everyone walks past a mirror."
boss.loki.intro2: "I will tell you one true thing and one false. Guess which of the two will let you sleep."
boss.loki.intro3: "And look closely: in this hall there is only one shadow. It is mine."
boss.loki.mid: "Do you know what the Seventh World is? A prison. And you are the cell."
boss.loki.mid2: "Ouranthos is dead, little seed. No one will come to gather you."
boss.loki.defeat: "Well done. One of the two was true, you know? Hold on to it... if you can tell which."
