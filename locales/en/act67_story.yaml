story.atto6.intro_01: "A hollow root descends from the crown of Yggdrasil down to the Inferno. The descent is a journey backward."
story.atto6.intro_02: "Through the cracks in the bark you see again everything you crossed: the dragons' nests, the garden, the snow, the flames, the castle."
story.atto6.intro_03: "The sky is less violet. Four shades of twilight have already melted toward gold."
story.atto6.lucifero_in_piedi: "The throne of swords is empty. Lucifero waits for you standing, his wings open up to the vaults."
story.atto6.porta_rovesciata: "Behind the throne the Porta Rovesciata opens. Beyond it, the sky lies beneath your feet."
voce.atto6.radice: "Go back to where you were spared, Bearer. The one who let you go now wants to know why."
voce.atto6.radice_altare: "Every step down is a step you have already taken. Remember them: you will need them."
voce.atto6.cattedrale_altare: "He said no, and the sky lost him. You carry a yes. Show it to him."
voce.atto6.capovolta_altare: "In the Rovescio the sky lies underfoot. Do not look for up: look for your footing."
voce.atto6.deserto_altare: "This ash was a world. Something is still eating it, one mouthful at a time."
voce.atto6.palazzo_altare: "She remembers every fallen world. He chose to forget them. You carry his heart."
voce.atto7.terrazze_altare: "This was the sky of the one who said no. Now the one who breathed the worlds is watching you."
voce.atto7.collasso_altare: "Chaos is awake. You are not alone, Bearer: breathe with him."
