# Act III — The White Silence (part B): bosses, parts, time-of-day variants.
boss.grande_lupo.title: "The First of the Three Spirits"
boss.grande_lupo.lore: "One of the Three Spirits of the Taiga, guide and keeper of the forest. He tests whoever crosses it to find out whether they are Chaos: discovering you are not is his answer."
boss.grande_lupo.spirit: "Spirit of the Wolf"
boss.grande_lupo.tod.alba: "At dawn he circles you and studies you before he bites."
boss.grande_lupo.tod.notte: "At night the storm comes with the first howl."
boss.grande_lupo.intro: "I smelled you three valleys away. You smell of a seed... but Chaos too knows how to wear a mask. Let me look at you."
boss.grande_lupo.mid: "We are two, now. Chaos devours without looking: do you still look?"
boss.grande_lupo.defeat: "You are not Chaos. Chaos would not have stopped. Go, little seed: my brother of the woods is waiting for you."
boss.grande_orso.title: "The Second of the Three Spirits"
boss.grande_orso.lore: "Second spirit of the Taiga, protector of the woods. For centuries he defended the oldest trees. He fights to know whether you can protect something."
boss.grande_orso.tod.alba: "At dawn he does not stray from the oldest trees: he rarely charges, but he grabs you more often."
boss.grande_orso.tod.notte: "At night he comes out of the dark between the trunks, head down."
boss.grande_orso.intro: "The wolf let you pass. I do not ask you what you are. I ask you what you are able to protect."
boss.grande_orso.mid: "Do you feel the forest? It shakes with me. Now protect yourself, at least."
boss.grande_orso.defeat: "You protected the small light you carry, to the very end. That is enough. At the drums waits the one who bound us."
boss.sciamano.title: "The Binder of the Three Spirits"
boss.sciamano.lore: "Binder of the Three Spirits of the Taiga: the wolf, the bear and the raven answer his drum. He knows the roads of the water, and to whoever bests him he points out the Great River and the Seekers' Ship."
boss.sciamano.tod.alba: "At dawn the drum begins with the wolf's pace."
boss.sciamano.tod.notte: "At night the drum opens with the raven, and in the dark the spirits run slower."
boss.sciamano.intro: "The wolf smelled you, the bear held you. Now listen to the drum: it will tell you who you are."
boss.sciamano.mid: "The raven sees farther than all of us. Let him look at you from above."
boss.sciamano.defeat: "The river knows where the sea is. The sea knows where the garden is."
