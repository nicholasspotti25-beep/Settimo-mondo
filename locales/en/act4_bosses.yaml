# Act IV — The God's Garden: bosses, titles, lines, lore, time-of-day variants.
boss.re_mantide.title: "Chief of the Garden's Guards"
boss.re_mantide.lore: "Chief of the guards of Uruk's garden. He studied every intruder the way a naturalist studies a rare insect, and only then pruned it. He kept the first gate on the way to the greenhouse."
boss.re_mantide.intro: "Stay still. Let me look. Two arms, no wings, and the eyes of something that does not give up. What a curious species."
boss.re_mantide.mid: "The crown blooms only for those worth studying up close."
boss.re_mantide.defeat: "I shall write it all down: a species that will not be pruned. The first gate is yours."
boss.re_mantide.tod.alba: "At dawn he is curious: he circles you and watches before he strikes."
boss.re_mantide.tod.notte: "At night the leaves are dark: he vanishes more often and rises behind you."
boss.coleottero_imperiale.title: "General of Uruk's Court"
boss.coleottero_imperiale.lore: "General of Uruk's court, armored in metallic blue. He fought head down and respected only those who withstood his mandibles. He opened the second gate to a worthy opponent."
boss.coleottero_imperiale.intro: "The Mantis King let you pass. I will not. I am the general of this court: show me whether you deserve the second gate."
boss.coleottero_imperiale.mid: "Still standing. Then you are worthy of my wings."
boss.coleottero_imperiale.defeat: "A worthy opponent. I salute you, little warrior: the second gate is open."
boss.coleottero_imperiale.tod.alba: "At dawn he salutes you before the fight, and grabs less."
boss.coleottero_imperiale.tod.notte: "At night his shell catches no light: he charges out of the dark more often."
boss.regina_formica.title: "Keeper of the Last Gate"
boss.regina_formica.lore: "Queen of the anthill under the roots, her golden abdomen swollen, surrounded by luminous eggs. She never fought up close: she sent her workers. Behind the anthill begins the underground passage to Uruk's greenhouse."
boss.regina_formica.tod.alba: "At dawn she tends her eggs: fewer workers march, and the eggs pulse more often."
boss.regina_formica.tod.notte: "At night the eggs light the anthill: the workers march more often."
