# Act III — The White Silence (part B): captions and the Dawn Voice (Taiga, Grande Fiume, the port, the sea).
story.atto3.lupo_intro: "The snow of the clearing rises in a cloud. Inside it, two amber eyes."
story.atto3.lupo_sentiero: "The wolf melts into the snow. Between the firs a path opens toward the forest of the logs."
voce.atto3.taiga_altare: "Here the Frost becomes forest. The firs are as old as the snow, and three spirits watch over them: the wolf, the bear, and the one who bound them."
voce.atto3.lupo_caduto: "He was looking for Chaos in your eyes and did not find it: that was the test. The second spirit protects the woods, and he will not ask who you are, but what you are able to defend."
voce.atto3.taiga_orso_altare: "Do you hear the trees? They creak even without wind. Something enormous walks among the trunks, slowly, like one who has never been in a hurry."
story.atto3.orso_intro: "Among the fallen trunks something breathes. The moss moves: it is not moss, it is fur."
story.atto3.orso_tamburi: "The bear lies down among the trees he defended. Beyond the woods, far away, drums are beating."
voce.atto3.orso_caduto: "He asked you what you are able to defend, and you answered without words: the light you carry inside. The third spirit is not a beast: he is the one who bound them both."
voce.atto3.taiga_tamburi_altare: "Listen: drums, far away. Whoever plays them knows the way to the river."
