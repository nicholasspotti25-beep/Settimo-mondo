# Act III — The White Silence (part A): intro, captions, Voice of Dawn.
story.atto3.titolo: "Act III — The White Silence"
story.atto3.intro.01: "The Stair of the Damned climbs a thousand steps through the rock. With every step the heat of the Inferno falls further behind."
story.atto3.intro.02: "At the top, the wind. White ridges under the gold-and-violet sky, and a silence so vast you can hear the seed beating."
story.atto3.gigante_intro: "From the crater rises a tower of black rock. Around it the snow melts."
story.atto3.cratere_spento: "On the crater's rim the snow begins to fall again."
voce.atto3.intro: "This was the world of Frost, the third to fall. The snow still remembers everything: walk softly."
voce.atto3.gigante_caduto: "The fire goes back to sleep under the snow. He was not your enemy: he was a promise no one ever released."
voce.atto3.vulcano_altare: "You have left the Inferno, but the Inferno has not left this mountain. Up there, someone holds it down with his bare hands."
voce.atto3.corona_vista_altare: "Look at the auroras: they are what remains of the sky of Frost. Down there, in a cave, someone has painted the sun."
voce.atto3.corona_altare: "The beast of the cave hates no one. It defends the only thing it has: a memory."
voce.atto3.rocca_altare: "You have seen the painted dawn. It was real, once. Now you know what you are looking for."
voce.atto3.rocca_trono_altare: "The one who sits on the throne of rime lies as he breathes. But even a liar sometimes tells the truth. Listen to everything; believe half."
story.atto3.yeti_intro: "The walls of the cave are covered in ancient colors. At the far end, something white rises before the painting."
story.atto3.yeti_dipinto: "The beast slumps beneath the painting. On the rock, a golden disc rises from a white horizon."
voce.atto3.yeti_caduto: "That is the last dawn, the only sun the world remembers. He painted it so as not to forget it. You carry it inside you: go and make it rise."
