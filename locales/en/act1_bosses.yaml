# Act I — Wandering Knight, Elder Tree, Swamp Monster, Great Devourer (mini: no text), Charon.
# Dialogue, lore (Mirror of Memories), time-of-day notes, parts, figures, whispers of the thousand voices, sequence captions
# and Dawn Voice lines at the Act I altars.

# --- Cavaliere Errante (Wandering Knight)
boss.cavaliere_errante.intro: "Another seeking the dawn? I have met many on these plains. None of them found it."
boss.cavaliere_errante.intro2: "I have ridden my whole life toward the horizon. Show me whether your road is longer than mine."
boss.cavaliere_errante.mid: "My horse has run enough. On foot now, as in the beginning."
boss.cavaliere_errante.salute: "En garde, traveler. Let it be a fair duel."
boss.cavaliere_errante.salute2: "On foot, and face to face. As is fitting."
boss.cavaliere_errante.defeat: "There... now I understand. The dawn is not found. It is carried."
boss.cavaliere_errante.defeat2: "Take my lantern. I never learned to light it... you will."
boss.cavaliere_errante.lore: "The first of the Seekers: he rode his whole life chasing a dawn that never rose, an unlit lantern hanging from his saddle. Falling, he understood that the dawn is not found: it is carried."
boss.cavaliere_errante.tod.alba: "At dawn he salutes with his sword and duels fairly, face to face."
boss.cavaliere_errante.tod.notte: "At night he vanishes into the dark of the tall grass and charges from where you are not looking."
part.cavaliere_errante.steed: "Grey steed"
part.cavaliere_errante.rider: "Knight"
story.atto1.lanterna: "You received the Knight's Lantern. From now on it will shine, lit, at every altar."

# --- Elder Tree
boss.elder_tree.intro: "Small shadowless thing... my shadow is the whole forest. Stay inside it."
boss.elder_tree.defeat: "The light... I had forgotten... it is warm."
boss.elder_tree.lore: "A seed of Yggdrasil grown without sun, bent toward a light that never came. Its shadow covered the forest for centuries; dying, it let through the first ray of light the world had seen since."
part.elder_tree.heart: "Glowing heart"
story.atto1.primo_raggio: "For the first time in centuries, a ray of light touches the forest floor."

# --- Mostro della Palude (Swamp Monster)
boss.mostro_della_palude.intro: "...another... another seeker... come down with us... there is room down here..."
boss.mostro_della_palude.defeat: "...let us sink... let us sleep... at last..."
boss.mostro_della_palude.lore: "The heap of Seekers drowned in the swamp, fused together by the mud: it shows what happens to those who fail. Among the thousand voices, one repeats that the ferryman does not want coins."
minion.mostro_della_palude.annegato_lanterna: "Drowned of the Lanterns"
minion.mostro_della_palude.annegato_canne: "Drowned of the Reeds"
minion.mostro_della_palude.annegato_ossa: "Drowned of the Bones"
# The thousand voices announce every attack before it comes (one family per kind of attack).
boss.mostro_della_palude.voices.rise.1: "...rising... rising from the water..."
boss.mostro_della_palude.voices.rise.2: "...we surface again... look at us..."
boss.mostro_della_palude.voices.slam.1: "...hands down... crush it..."
boss.mostro_della_palude.voices.slam.2: "...both of them... on your head..."
boss.mostro_della_palude.voices.slam.3: "...strike the ground... as the water struck us..."
boss.mostro_della_palude.voices.wave.1: "...the mud runs... don't let it catch you..."
boss.mostro_della_palude.voices.wave.2: "...a wave... slow... heavy..."
boss.mostro_della_palude.voices.wave.3: "...sink your legs... like ours..."
boss.mostro_della_palude.voices.arms.1: "...arms beneath you... beneath..."
boss.mostro_della_palude.voices.arms.2: "...we grab you from the bottom..."
boss.mostro_della_palude.voices.arms.3: "...hands in the mire... so many hands..."
boss.mostro_della_palude.voices.reach.1: "...far... the arm reaches far..."
boss.mostro_della_palude.voices.reach.2: "...you are not far enough..."
boss.mostro_della_palude.voices.sweep.1: "...sideways... sweep... sweep it away..."
boss.mostro_della_palude.voices.sweep.2: "...a wide turn... wide..."
boss.mostro_della_palude.voices.sweep.3: "...the lanterns swing... around, around..."
boss.mostro_della_palude.voices.below.1: "...down into the water... then beneath you..."
boss.mostro_della_palude.voices.below.2: "...watch the bubbles... watch the bubbles..."
boss.mostro_della_palude.voices.throw.1: "...throw it... throw it far..."
boss.mostro_della_palude.voices.throw.2: "...from afar... we reach you from afar..."
boss.mostro_della_palude.voices.thrust.1: "...reed points... one, two, three..."
boss.mostro_della_palude.voices.thrust.2: "...pierce... pierce..."
boss.mostro_della_palude.voices.lunge.1: "...run at it... run..."
boss.mostro_della_palude.voices.lunge.2: "...a leap... now..."
boss.mostro_della_palude.voices.clue: "...the ferryman... does not want coins... does not want coins..."

# --- Caronte (Charon)
boss.caronte.intro: "I do not ferry the living. And I want no coins: whoever boards my boat leaves me a memory."
boss.caronte.intro2: "But you... You have no shadow, Bearer. Nor a past. What could you give me?"
boss.caronte.mid: "The boat will not bear you. Then the river will judge you."
boss.caronte.defeat: "No memory... and yet something in you weighs more than a soul."
boss.caronte.defeat2: "Board. I will take you to the Gate of Dis. What you carry in your chest will be your toll."
boss.caronte.lore: "The ferryman of the River of Souls. He wants no coins but memories, and keeps the eyes of souls in his lantern. To the Bearer, who had none, he granted passage all the same."
boss.caronte.tod.giorno: "By day he frees few souls, but very fast ones."
boss.caronte.tod.notte: "At night the lantern empties: many slow souls fill the dark."
part.caronte.lantern: "Lantern of eyes"
story.atto1.traghetto: "Charon ferries you in silence toward the Gate of Dis."

# --- Dawn Voice (Act I altars and lines after the bosses)
voce.atto1.pianure_vista: "See how vast it is. All that you see is waiting for a morning that does not come."
voce.atto1.pianure: "On these plains many searched for the dawn. They were called Seekers. None of them carried a seed."
voce.atto1.cavaliere_lanterna: "His lantern is lit now. You did not light it: I did, through you."
voce.atto1.foresta: "Here the trees grow crooked, toward a light that is not there. Even they remember the sun better than you."
voce.atto1.primo_raggio: "Did you see it? The first ray in centuries. It is small. But it is a beginning."
voce.atto1.palude: "Every unlit lantern in this swamp was a hope. Do not become one of them."
voce.atto1.annegati: "Now they sleep. You listened to their voices: remember them. The ferryman does not want coins."
voce.atto1.molo: "Do you hear the water flowing beyond the fog? It is the River of Souls. There the world of the living ends."
voce.atto1.fiume: "The ferryman will ask a price. You have no coins, no memories. You have only me."
voce.atto1.senza_ricordi: "You have no past, it is true. But every step you take becomes a memory. The Seventh World will be born from these."
