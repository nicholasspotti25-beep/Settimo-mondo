boss.lucifero_2.fought: "You came back to take the rest of the blow."
boss.lucifero_2.begged: "You came back on your feet. I like that better."
boss.lucifero_2.no: "I lost the sky for saying no. Show me your yes is worth as much."
boss.lucifero_2.mid: "Do you feel the heat? My cathedral has been burning since I fell."
boss.lucifero_2.caduta: "Watch closely, little seed. It is the same blow. You are not the same."
boss.lucifero_2.parried: "There. That is a yes."
boss.lucifero_2.defeat: "Enough. You said yes with your whole body."
boss.lucifero_2.piuma: "You still keep my feather. Carry it where I can no longer climb."
boss.lucifero_2.cicatrice: "The scar I left you no longer burns. I can feel it from here."
boss.lucifero_2.porta: "The sky, now, is beneath us."
boss.verme_mangiamondi.segment: "Millstone of the Worm"
