# Act V — The Dragon Realm: intro, captions, Dawn Voice.
story.atto5.titolo: "Act V — The Dragon Realm"
story.atto5.intro.01: "You look back one last time. The endless garden was a flowerbed in an ordinary park. The world has its measure again, and you stand taller than before."
story.atto5.intro.02: "Past the park gate the grass ends. A plateau covered in bones begins: ribs as tall as towers, skulls as large as houses. This is where the dragons came to die."
story.atto5.intro.03: "On the horizon, beyond the clouds, rises a tree no gaze can measure. Its crown stands above the sky. Yggdrasil."
voce.atto5.intro: "The fifth world belonged to the Dragons. These bones remain, and a tree that holds together what Chaos did not swallow. Climb, Bearer. Up there someone has been waiting for you since before you were born."
voce.atto5.ossa_altare: "These bones were wings. Chaos devoured their world, not their memory. Listen to the wind between the ribs: it knows the way to the tree."
voce.atto5.nidi_altare: "Nothing has hatched in the stone nests for centuries. And yet something still keeps them, with three mouths and a single instinct."
voce.atto5.osservatorio_altare: "At the top of that tower someone read your name in the stars when you had no name yet. She read your end too. She wants to know whether the stars were right."
